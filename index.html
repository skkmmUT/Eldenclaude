let DECOR = null;

function drawWorld() {
  const w = world, h = game.hero, G = w.ground;
  const camX = R(w.camX), camY = R(w.camY);
  drawBackground(ctx, w.bg, camX, camY, w.t);
  ctx.save();
  ctx.translate(-camX, -camY);
  const vis = (x, m = 80) => x > camX - m && x < camX + W + m;

  for (const bd of w.boards) {
    if (!vis(bd.x, 120)) continue;
    const tw = textWidth(bd.t) + 8, by = R(bd.y - 58);
    px(ctx, bd.x - 1, by + 10, 3, 48, '#6a6a6a');
    px(ctx, R(bd.x - tw / 2) - 1, by - 1, tw + 2, 13, '#1a1a1a');
    px(ctx, R(bd.x - tw / 2), by, tw, 11, ['#f2e6c4', '#2b6fd8', '#2f9a46', '#8a5a2b', '#2f8a4a'][w.th]);
    drawText(ctx, bd.t, bd.x, by + 2, w.th === 0 ? '#7a1f14' : '#ffffff', 1, 0.5, null);
  }
  for (const d of w.decor) {
    if (!vis(d.x, 100)) continue;
    const img = DECOR[d.k];
    ctx.drawImage(img, R(d.x - img.width / 2), R(d.y - img.height + 2));
  }
  for (const L of w.loops) {
    if (!vis(L.x, 120)) continue;
    const z = w.zone.loop, img = loopImage(L.r, z[0], z[1], z[2]);
    ctx.drawImage(img, R(L.x - img.width / 2), R(L.gy - L.r - img.height / 2));
  }
  // pits
  for (const p of G.pits) {
    if (p.x1 < camX - 10 || p.x0 > camX + W + 10) continue;
    if (w.zone.pit !== 'hole') {
      const river = w.zone.pit === 'river', top = p.y + 16;
      px(ctx, p.x0, top, p.x1 - p.x0, camY + H - top, river ? '#2f7fa0' : '#2f63b0');
      for (let x = p.x0; x < p.x1; x += 2) {
        const wy = R(Math.sin(x * 0.12 + w.t * (river ? 0.2 : 0.08)) * 1.5);
        px(ctx, x, top + wy - 1, 2, 2, river ? '#e8f8ff' : '#9fd0f0');
      }
      for (let y = top + 8; y < camY + H; y += 6) px(ctx, p.x0 + (river ? (w.t * 2 + y) % 12 : 0), y, p.x1 - p.x0 - 12, 1, river ? '#286a8a' : '#285aa0');
    } else {
      const top = p.y + 8;
      px(ctx, p.x0, top, p.x1 - p.x0, camY + H - top, '#24180f');
      px(ctx, p.x0, top, p.x1 - p.x0, 3, '#3a2a1a');
      for (let x = p.x0 + 4; x < p.x1 - 4; x += 12) px(ctx, x, top + 10 + (x % 7), 4, 2, '#4a3624');
    }
  }
  // ground columns
  for (let sx = 0; sx < W; sx++) {
    const wx = camX + sx;
    const g = G.at(wx + 0.5);
    if (g === null) continue;
    const gy = R(g), hgt = camY + H - gy;
    if (hgt <= 0) continue;
    const tx = ((wx % 64) + 64) % 64;
    const sh = Math.min(hgt, 400);
    ctx.drawImage(w.tex, tx, 0, 1, sh, wx, gy, 1, sh);
    if (hgt > 400) px(ctx, wx, gy + 400, 1, hgt - 400, '#20150c');
  }
  // goal post
  if (w.goal && vis(w.goal.x)) {
    const gl = w.goal;
    px(ctx, gl.x - 1, gl.y - 52, 3, 52, '#888'); px(ctx, gl.x, gl.y - 52, 1, 52, '#bbb');
    const c = Math.cos(gl.spin), sw = Math.max(2, R(Math.abs(c) * 26));
    const done = gl.passed && gl.t2 > 120;
    const img = done || (gl.passed && c < 0) ? SPR.goalE : SPR.goalQ;
    ctx.drawImage(img, R(gl.x - sw / 2), R(gl.y - 78), sw, 26);
  }
  for (const st of w.stops) if (vis(st.x)) drawBusStop(ctx, st.x, st.y, st.used);
  for (const c of w.cps) if (vis(c.x)) ctx.drawImage(c.on ? SPR.cpOn : SPR.cpOff, R(c.x - 18), R(c.y - 48));
  for (const s of w.springs) if (vis(s.x)) {
    const img = s.p === 'R' ? SPR.springR : SPR.springY;
    if (s.anim > 0) { px(ctx, s.x + 4, s.y - 4, 10, 6, '#aaa'); ctx.drawImage(img, 0, 0, 18, 4, R(s.x), R(s.y - 6), 18, 4); ctx.drawImage(img, 0, 4, 18, 8, R(s.x), R(s.y + 4), 18, 8); }
    else ctx.drawImage(img, R(s.x), R(s.y));
  }
  for (const p of w.plats) if (vis(p.x, 100)) drawPlat(p, w.zone.plat, w.t);
  for (const s of w.solids) {
    if (s.dead || !vis(s.x, 60)) continue;
    if (s.type === 'box') ctx.drawImage(SPR.box, R(s.x), R(s.y));
    else if (s.type === 'barrier') {
      ctx.drawImage(SPR.barrier, R(s.x), R(s.y - 6));
      if ((w.t >> 4) % 2) px(ctx, s.x + 19, s.y - 5, 2, 3, '#ffb020');
    } else if (s.type === 'monitor') {
      ctx.drawImage(SPR.monitor, R(s.x), R(s.y));
      const icon = { checks: SPR.iconChecks, shield: SPR.iconShield, shoes: SPR.iconShoes, life: SPR.iconLife, magnet: SPR.iconMagnet }[s.item];
      if ((w.t % 40) < 5) for (let i = 0; i < 12; i++) px(ctx, s.x + 3 + (i * 7 + w.t) % 15, s.y + 3 + (i * 5) % 12, 2, 1, '#bbb');
      else ctx.drawImage(icon, R(s.x + 4), R(s.y + 4));
      px(ctx, s.x + 4, s.y + 4, 2, 1, '#ffffff88');
    }
  }
  for (const c of w.cones) {
    if (!vis(c.x)) continue;
    ctx.save(); ctx.translate(R(c.x), R(c.y)); ctx.rotate(c.rot); ctx.drawImage(SPR.cone, -6, -16); ctx.restore();
  }
  // checks
  const ph = w.t * 0.09;
  for (const c of w.checks) if (!c.got && vis(c.x, 20)) drawCheck(c.x, c.y, ph);
  for (const c of w.loose) if (c.t > 60 || (c.t >> 2) % 2) drawCheck(c.x, c.y, ph * 2.5);
  // enemies
  for (const e of w.enemies) {
    if (!vis(e.x)) continue;
    if (e.inv > 0 && (e.inv >> 2) % 2) continue;
    ctx.save();
    if (e.state === 'happy') ctx.globalAlpha = clamp(1 - ((e.fade || 0) - 100) / 60, 0, 1);
    ctx.translate(R(e.x), R(e.y));
    if (e.dir < 0) ctx.scale(-1, 1);
    if (e.type === 'lyuda') drawLyuda(ctx, e.ph, { parrot: e.parrot, flap: (w.t >> 3) % 2 && e.talkT > 200, happy: e.state === 'happy' });
    else if (e.type === 'porter') drawPorter(ctx, e.ph, { happy: e.state === 'happy' });
    else if (e.type === 'arkhar') drawArkhar(ctx, e.ph, { air: e.air, happy: e.state === 'happy' });
    else drawLi(ctx, e.ph, { charge: e.state === 'charge' || e.state === 'wind', dizzy: e.state === 'dizzy', happy: e.state === 'happy' });
    ctx.restore();
  }
  for (const p of w.parrots) drawParrot(ctx, p.x, p.y, (p.flap >> 2) % 2, p.state === 'out' ? p.tx < p.sx : (p.owner.x - 4) < p.x);
  // hazards (boss)
  for (const z of w.hazards) drawHazard(z, w.t);
  if (w.boss) {
    const b = w.boss;
    if (!(b.inv > 0 && (b.inv >> 2) % 2)) {
      ctx.save(); ctx.translate(R(b.x), R(b.y));
      const hurt = b.inv > 0 || b.state === 'defeated';
      if (b.type === 'auditor') { if (h.x < b.x && b.state !== 'leave') ctx.scale(-1, 1); drawAuditor(ctx, b.ph, { hurt, stamp: b.stamp > 0 }); }
      else {
        if (b.dir < 0) ctx.scale(-1, 1);
        if (b.type === 'asan') drawAsan(ctx, b.ph, { hurt, throw: b.throwT > 0 });
        else if (b.type === 'roller') drawRoller(ctx, b.ph, { hurt });
        else if (b.type === 'forklift') drawForklift(ctx, b.ph, { hurt, forkY: b.forkY, carry: b.carry });
        else drawLeopard(ctx, b.ph, { hurt, state: b.lstate || 'run' });
      }
      ctx.restore();
    }
  }
  for (const k of w.kalpaks) if (!k.got && vis(k.x)) drawGoldKalpak(ctx, k.x, k.y + 6, w.t);
  if (w.bus) drawBus(ctx, w.bus.x, w.bus.y, '110');
  if (w.goldCheck && !w.goldCheck.got) {
    const gc = w.goldCheck, c = Math.cos(gc.t * 0.05), sw = Math.max(4, R(Math.abs(c) * 48));
    ctx.drawImage(SPR.goldCheck, R(gc.x - sw / 2), R(gc.y - 13), sw, 26);
    if (gc.t % 10 < 5) px(ctx, gc.x - 20 + (gc.t * 3) % 40, gc.y - 16, 2, 2, '#fff');
  }
  if (h.ride) drawBus(ctx, h.x, h.y + 34, '110');
  drawHero(h);
  // effects
  for (const f of w.fx) drawFx(f);
  drawWeather(w, camX, camY);
  const placed = [];
  for (const b of w.bubbles) drawBubble(b, camX, placed);
  ctx.restore();
  if (w.night) { px(ctx, 0, 0, W, H, 'rgba(18,24,80,0.22)'); }
}

function drawWeather(w, camX, camY) {
  if (w.lv.snow) {
    for (let i = 0; i < 70; i++) {
      const x = ((i * 73 + w.t * (0.3 + (i % 3) * 0.2) + (w.windF || 0) * w.t * 8) % (W + 20) + W + 20) % (W + 20) - 10;
      const y = (i * 41 + w.t * (0.5 + (i % 4) * 0.2)) % H;
      px(ctx, camX + x, camY + y, i % 5 ? 1 : 2, i % 5 ? 1 : 2, '#ffffff');
    }
  }
  if (w.lv.wind && w.gust > 0.15) {
    ctx.save(); ctx.globalAlpha = Math.min(0.7, w.gust);
    for (let i = 0; i < 18; i++) {
      const x = ((i * 131 - w.windDir * w.t * 9) % W + W) % W, y = (i * 59) % (H - 40) + 20;
      px(ctx, camX + x, camY + y, 14 + (i % 3) * 6, 1, '#ffffff');
      if (i % 4 === 0) px(ctx, camX + (x + 30) % W, camY + y + 6, 2, 2, '#6ab04c');
    }
    ctx.restore();
  }
}

function drawHazard(z, t) {
  switch (z.kind) {
    case 'box': ctx.drawImage(SPR.box, R(z.x - 16), R(z.y - 24)); break;
    case 'stamp': px(ctx, z.x - 2, z.y - 14, 4, 6, '#7a4a20'); px(ctx, z.x - 6, z.y - 8, 12, 6, '#c0392b'); px(ctx, z.x - 6, z.y - 3, 12, 1, '#7d1f15'); break;
    case 'melon':
      disc(ctx, z.x, z.y, 6, '#2f8a2f');
      for (let k = -1; k <= 1; k++) { const a = (z.rot || 0) + k * 0.8; px(ctx, z.x + Math.cos(a) * 3, z.y + Math.sin(a) * 3 - 1, 1, 3, '#1f5f1f'); }
      px(ctx, z.x - 3, z.y - 4, 2, 1, '#8fd08f'); break;
    case 'tar': {
      const a = 1 - Math.max(0, z.t - z.life + 30) / 30;
      ctx.save(); ctx.globalAlpha = a;
      px(ctx, z.x - 16, z.y - 3, 32, 4, '#151515'); px(ctx, z.x - 12, z.y - 3, 10, 1, '#555');
      if ((t + z.x) % 20 < 10) px(ctx, z.x - 4 + (t % 8), z.y - 8 - (t % 6), 2, 2, '#bbbbbb');
      ctx.restore(); break;
    }
    case 'cone': ctx.drawImage(SPR.cone, R(z.x - 6), R(z.y - 16)); break;
    case 'wave':
      px(ctx, z.x - 6, z.y - 6, 12, 6, '#f4f8ff'); px(ctx, z.x - 4, z.y - 10, 8, 4, '#ffffff'); px(ctx, z.x - 6, z.y - 1, 12, 1, '#b8c8e0'); break;
  }
}

function drawCheck(x, y, ph) {
  const c = Math.cos(ph), sw = Math.max(2, R(Math.abs(c) * 24));
  ctx.drawImage(SPR.check, R(x - sw / 2), R(y - 6), sw, 13);
}

function drawPlat(p, kind, t) {
  const x = R(p.x), y = R(p.y), w = p.w;
  if (kind === 'stall') {
    px(ctx, x, y, w, 5, '#a0703a'); px(ctx, x, y, w, 1, '#c89458'); px(ctx, x, y + 5, w, 2, '#6a4a2a');
    for (let i = 0; i < w; i += 8) {
      const col = (i / 8) % 2 ? '#d8342a' : '#fff3e0';
      px(ctx, x + i, y + 7, 8, 3, col); px(ctx, x + i + 2, y + 10, 4, 2, col);
    }
  } else if (kind === 'container') {
    px(ctx, x, y, w, 10, '#c0392b'); px(ctx, x, y, w, 2, '#e86a5a');
    for (let i = 2; i < w; i += 4) px(ctx, x + i, y + 2, 1, 8, '#8a2a20');
    px(ctx, x + w / 2 - 1, y - 8, 2, 8, '#444'); px(ctx, x + 4, y - 9, w - 8, 1, '#444');
  } else if (kind === 'log') {
    px(ctx, x, y, w, 8, '#8a5a2b'); px(ctx, x, y, w, 2, '#b07a3e'); px(ctx, x, y + 6, w, 2, '#5a3a1a');
    disc(ctx, x + 3, y + 4, 4, '#c89458'); disc(ctx, x + 3, y + 4, 2, '#8a5a2b');
    for (let i = 10; i < w - 4; i += 14) px(ctx, x + i, y + 3, 6, 1, '#6a4320');
    const wv = R(Math.sin(t * 0.15 + p.x0) * 2);
    px(ctx, x - 4 + wv, y + 9, w + 8, 1, '#e8f8ff');
  } else if (kind === 'scaffold') {
    px(ctx, x, y, w, 4, '#a3a9b1'); px(ctx, x, y, w, 1, '#d0d4da'); px(ctx, x, y + 4, w, 2, '#5a6068');
    for (let i = 0; i < w; i += 6) px(ctx, x + i, y + 6, 3, 3, (i / 6) % 2 ? '#f2c400' : '#222');
    px(ctx, x + 4, y + 6, 2, 12, '#777'); px(ctx, x + w - 6, y + 6, 2, 12, '#777');
    for (let i = 8; i < w - 8; i += 8) px(ctx, x + i, y + 1, 3, 2, '#7d838b');
  } else {
    // swan pedal boat
    px(ctx, x + 2, y, w - 4, 3, '#f0f0f0');
    for (let k = 0; k < 10; k++) { const ins = R(k * k * 0.12); px(ctx, x + ins, y + 3 + k, w - ins * 2, 1, k < 2 ? '#ffffff' : '#e6e6ec'); }
    px(ctx, x + 6, y + 6, w - 12, 2, '#5aa0e0');
    px(ctx, x + w - 10, y - 16, 4, 18, '#ffffff'); px(ctx, x + w - 12, y - 18, 7, 5, '#ffffff');
    px(ctx, x + w - 6, y - 16, 4, 2, '#f08a24'); px(ctx, x + w - 9, y - 17, 1, 1, '#111');
    px(ctx, x + 6, y - 6, 18, 2, '#e8352a'); px(ctx, x + 8, y - 4, 2, 4, '#e8352a'); px(ctx, x + 20, y - 4, 2, 4, '#e8352a');
    const wv = R(Math.sin(t * 0.1 + p.x0) * 2);
    px(ctx, x - 4 + wv, y + 13, w + 8, 1, '#cfe9ff');
  }
}

function heroPose(h) {
  if (h.dead) return 'dead';
  if (h.ride) return (world.t >> 5) % 2 ? 'victory' : 'idle';
  if (h.hurt) return 'hurt';
  if (h.springPose) return h.vy < 0 ? 'spring' : 'fall';
  if (!h.onGround && !h.loop) return 'fall';
  if (h.crouch) return 'crouch';
  if (h.skid > 0) return 'skid';
  if (h.loop) return 'dash';
  const v = Math.abs(h.vx);
  if (v < 0.05) return 'idle';
  if (v < 2.6) return 'walk';
  return v < 5.9 ? 'run' : 'dash';
}

function drawHero(h) {
  if (h.inv > 0 && !h.hurt && (h.inv >> 2) % 2) return;
  const ballish = h.ball || h.rolling || (h.crouch && h.spin > 0.5);
  ctx.save();
  ctx.translate(R(h.x), R(h.y));
  if (h.loop) ctx.rotate(-h.loop.th);
  else if (h.onGround && !h.on && !ballish) ctx.rotate(Math.atan(world.ground.slope(h.x)) * 0.6);
  if (ballish && !h.dead) {
    let f = Math.floor(h.ballRot) % 8; if (h.facing < 0) f = 7 - f;
    ctx.drawImage(BALL_FRAMES[f], -12, -24);
  } else {
    if (h.facing < 0) ctx.scale(-1, 1);
    drawErmek(ctx, heroPose(h), h.ph, (world.t % 220) < 6);
  }
  ctx.restore();
  if (h.shield && !h.dead) {
    const cy = h.y - (ballish ? 12 : 18), r = ballish ? 15 : 21;
    ctx.save();
    ctx.globalAlpha = 0.55 + Math.sin(world.t * 0.2) * 0.15;
    ctx.strokeStyle = '#e09a3a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(R(h.x), R(cy), r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.9;
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 + world.t * 0.03; px(ctx, h.x + Math.cos(a) * r - 1, cy + Math.sin(a) * r - 1, 2, 2, '#7a4310'); }
    ctx.restore();
  }
  if (h.shoes > 0 && Math.abs(h.vx) > 3 && world.t % 3 === 0) world.fx.push({ k: 'spark', x: h.x - h.facing * 10, y: h.y - 6 - RNG() * 20, t: 12 });
  if (h.crouch && h.spin > 0.5 && world.t % 3 === 0) world.fx.push(fxDust(h.x - h.facing * 10, h.y));
  if (h.magnet && !h.dead && world.t % 6 === 0) { const a = world.t * 0.3; px(ctx, h.x + Math.cos(a) * 16, h.y - 18 + Math.sin(a) * 16, 2, 2, '#7fd0ff'); }
}

function drawFx(f) {
  switch (f.k) {
    case 'dust': px(ctx, f.x - 1, f.y - 1, 3, 3, f.t > 10 ? '#e8e0d0' : '#c8c0b0'); break;
    case 'puff': {
      const r = 4 + (24 - f.t) * 0.6;
      for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; disc(ctx, f.x + Math.cos(a) * r, f.y + Math.sin(a) * r * 0.7, Math.max(1, R(f.t / 6)), '#f4f4f4'); }
      break;
    }
    case 'spark': {
      const s = f.t > 12 ? 1 : f.t > 6 ? 3 : 2;
      px(ctx, f.x - s, f.y, s * 2 + 1, 1, '#fff7b0'); px(ctx, f.x, f.y - s, 1, s * 2 + 1, '#fff7b0'); px(ctx, f.x, f.y, 1, 1, '#ffffff');
      break;
    }
    case 'shard': px(ctx, f.x, f.y, 3, 3, f.c); break;
    case 'paper': px(ctx, f.x, f.y, Math.abs(Math.sin(f.ph)) > 0.5 ? 6 : 3, 4, '#fafafa'); px(ctx, f.x + 1, f.y + 1, 2, 1, '#c33'); break;
    case 'heart': f.y -= 0.6; px(ctx, f.x - 2, f.y, 2, 2, '#ff4d6d'); px(ctx, f.x + 1, f.y, 2, 2, '#ff4d6d'); px(ctx, f.x - 1, f.y + 2, 3, 2, '#ff4d6d'); break;
    case 'score': drawText(ctx, String(f.n), f.x, f.y, '#fff', 1, 0.5); break;
    case 'icon': {
      const icon = { checks: SPR.iconChecks, shield: SPR.iconShield, shoes: SPR.iconShoes, life: SPR.iconLife, magnet: SPR.iconMagnet }[f.item];
      ctx.drawImage(icon, R(f.x - 6), R(f.y - 5)); break;
    }
    case 'splash':
      for (let i = 0; i < 6; i++) px(ctx, f.x - 12 + i * 5, f.y - (30 - f.t) * (i % 2 ? 1.2 : 0.8), 2, 3, '#bfe3ff');
      break;
  }
}

function drawBubble(b, camX, placed) {
  const o = b.owner, lines = wrapText(b.text, 20);
  const tw = Math.max(...lines.map(textWidth)), bw = tw + 9, bh = lines.length * 9 + 5;
  const ax = R(o.x), ay = R(o.y - (o.bh || 50));
  if (ax < camX - 16 || ax > camX + W + 16) return;
  const bx = R(clamp(ax - bw / 2, camX + 2, camX + W - bw - 2));
  let by = ay - bh - 3;
  for (let i = 0; i < placed.length; i++) {
    const q = placed[i];
    if (bx < q.x + q.w + 2 && bx + bw + 2 > q.x && by < q.y + q.h + 4 && by + bh + 4 > q.y) { by = q.y - bh - 5; i = -1; }
  }
  placed.push({ x: bx, y: by, w: bw, h: bh });
  ctx.save();
  if (b.t < 12) ctx.globalAlpha = b.t / 12;
  if (by + bh + 3 < ay) px(ctx, clamp(ax, bx + 3, bx + bw - 6), by + bh, 1, ay - by - bh, '#1a1a1a');
  px(ctx, bx, by, bw, bh, '#1a1a1a'); px(ctx, bx + 1, by + 1, bw - 2, bh - 2, '#ffffff');
  const tx = clamp(ax, bx + 3, bx + bw - 6);
  px(ctx, tx - 1, by + bh - 1, 4, 2, '#ffffff'); px(ctx, tx - 2, by + bh - 1, 1, 3, '#1a1a1a'); px(ctx, tx + 3, by + bh - 1, 1, 2, '#1a1a1a'); px(ctx, tx - 1, by + bh + 1, 2, 2, '#1a1a1a');
  lines.forEach((l, i) => drawText(ctx, l, bx + 5, by + 3 + i * 9, '#1a1a1a', 1, 0, null));
  ctx.restore();
}

// ============================================================
//  HUD & SCREENS
// ============================================================
function fmtTime(fr) { const s = Math.floor(fr / 60); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
const levelLabel = li => ZONES[LEVELS[li].th].name + ', АКТ ' + LEVELS[li].act;

function drawHUD() {
  const t = game.t, h = game.hero;
  px(ctx, 5, 5, 121, 46, 'rgba(10,14,40,0.45)');
  px(ctx, 5, H - 21, 72, 15, 'rgba(10,14,40,0.45)');
  drawText(ctx, 'ОЧКИ', 10, 8, '#ffd84a');
  drawText(ctx, String(game.score), 120, 8, '#ffffff', 1, 1);
  drawText(ctx, 'ВРЕМЯ', 10, 19, game.time > 9 * 3600 && (t >> 4) % 2 ? '#ff4040' : '#ffd84a');
  drawText(ctx, fmtTime(game.time), 120, 19, '#ffffff', 1, 1);
  drawText(ctx, 'ЧЕКИ SWIFT', 10, 30, game.checks === 0 && (t >> 4) % 2 ? '#ff4040' : '#ffd84a');
  drawText(ctx, String(game.checks), 120, 30, '#ffffff', 1, 1);
  drawText(ctx, 'КАЛПАКИ', 10, 41, '#ffd84a');
  for (let i = 0; i < 3; i++) {
    const got = i < game.kalGot.size;
    px(ctx, 84 + i * 12, 46, 9, 2, got ? '#5a3a00' : '#333');
    px(ctx, 85 + i * 12, 41, 7, 5, got ? '#ffd23a' : '#555');
  }
  ctx.drawImage(SPR.iconLife, 10, H - 18);
  drawText(ctx, 'ЭРМЕК ×' + game.lives, 26, H - 16, '#ffffff');
  drawText(ctx, 'УРОВЕНЬ ' + (game.li + 1) + '/10', W - 8, H - 16, '#ffffff', 1, 1);
  let ix = W - 20;
  if (h && h.shield) { ctx.drawImage(SPR.iconShield, ix, 8); ix -= 18; }

// ---------------- bonus stage: "wind of checks" ----------------
function startBonus() {
  game.state = 'bonus'; game.t = 0;
  game.bonus = { x: W / 2, vx: 0, items: [], caught: 0, stun: 0, time: 1200, ph: 0, done: false, life: false };
}
function updateBonus() {
  const B = game.bonus;
  if (B.done) {
    if (game.t > 60 && anyPressed()) afterBonus();
    return;
  }
  if (game.t < 90) return;
  B.time--;
  if (B.stun > 0) B.stun--;
  const acc = 0.6;
  if (B.stun <= 0 && keys.left) B.vx = Math.max(-4.5, B.vx - acc);
  else if (B.stun <= 0 && keys.right) B.vx = Math.min(4.5, B.vx + acc);
  else B.vx *= 0.8;
  B.x = clamp(B.x + B.vx, 16, W - 16);
  B.ph += Math.abs(B.vx) * 0.12;
  if (game.t % 13 === 0) {
    const r = RNG(), d = game.li / 9;
    const kind = r < 0.07 ? 'gold' : r < 0.25 + d * 0.1 ? 'fine' : 'check';
    B.items.push({ kind, x: 20 + RNG() * (W - 40), y: -16, vy: 1.1 + RNG() * 1.2 + d * 0.8, ph: RNG() * 6 });
  }
  for (const it of B.items) {
    it.y += it.vy; it.ph += 0.08; it.x += Math.sin(it.ph) * 0.6;
    if (Math.abs(it.x - B.x) < 17 && it.y > 162 && it.y < 186) {
      it.gone = true;
      if (it.kind === 'fine') { B.caught = Math.max(0, B.caught - 3); B.stun = 40; }
      else B.caught += it.kind === 'gold' ? 5 : 1;
    }
    if (it.y > H + 10) it.gone = true;
  }
  B.items = B.items.filter(i => !i.gone);
  if (B.time <= 0) {
    B.done = true; game.t = 0;
    game.score += B.caught * 100;
    if (B.caught >= 40) { game.lives++; B.life = true; }
  }
}
function drawBonus() {
  const B = game.bonus, t = game.t;
  drawBackground(ctx, world.bg, (world.t++) * 0.6, 233, world.t);
  for (let sx = 0; sx < W; sx++) ctx.drawImage(world.tex, sx % 64, 0, 1, 50, sx, 228, 1, 50);
  for (const it of B.items) {
    if (it.kind === 'check') drawCheck(it.x, it.y, it.ph);
    else if (it.kind === 'gold') ctx.drawImage(SPR.goldCheck, R(it.x - 12), R(it.y - 7), 24, 13);
    else ctx.drawImage(SPR.fine, R(it.x - 16), R(it.y - 6));
  }
  ctx.save(); ctx.translate(R(B.x), 228);
  if (B.vx < -0.3) ctx.scale(-1, 1);
  drawErmek(ctx, B.stun > 0 ? 'hurt' : 'spring', B.ph, false);
  ctx.restore();
  if (B.stun <= 0) {
    px(ctx, B.x - 12, 168, 24, 12, '#8a5a2b'); px(ctx, B.x - 12, 168, 24, 2, '#c89458'); px(ctx, B.x - 10, 170, 20, 3, '#3a2410');
    drawText(ctx, 'ЧЕКИ', B.x, 173, '#f2e6c4', 1, 0.5, null);
  } else drawText(ctx, 'ОЙ, ШТРАФ!', B.x, 160, '#ff6060', 1, 0.5);
  px(ctx, 5, 5, 150, 24, 'rgba(10,14,40,0.55)');
  drawText(ctx, 'ПОЙМАНО: ' + B.caught, 10, 8, '#ffd84a');
  drawText(ctx, 'ВРЕМЯ: ' + Math.max(0, Math.ceil(B.time / 60)), 10, 18, '#ffffff');
  if (t < 90 && !B.done) {
    drawPanel(80, 80, W - 160, 70);
    drawText(ctx, 'БОНУС-ЭТАП', W / 2, 90, '#ffd84a', 2, 0.5);
    drawText(ctx, 'ВЕТЕР ЧЕКОВ! ЛОВИ ЧЕКИ, НЕ ЛОВИ ШТРАФЫ.', W / 2, 112, '#ffffff', 1, 0.5);
    drawText(ctx, '40 ЧЕКОВ = +1 ЭРМЕК', W / 2, 126, '#9fe0ff', 1, 0.5);
  }
  if (B.done) {
    drawPanel(80, 70, W - 160, 90);
    drawText(ctx, 'ВЕТЕР СТИХ!', W / 2, 82, '#ffd84a', 2, 0.5);
    drawText(ctx, 'ПОЙМАНО ЧЕКОВ: ' + B.caught + '  (+' + B.caught * 100 + ' ОЧКОВ)', W / 2, 106, '#ffffff', 1, 0.5);
    if (B.life) drawText(ctx, '+1 ЭРМЕК!', W / 2, 120, '#9fe0ff', 1, 0.5);
    if (t > 60 && (t >> 4) % 2) drawText(ctx, 'НАЖМИ →', W / 2, 140, '#ffffff', 1, 0.5);
  }
}

  ctx.save(); ctx.translate(W / 2, 225); drawErmek(ctx, (t >> 5) % 2 ? 'victory' : 'idle', t * 0.1, false); ctx.restore();
  drawPanel(40, 10, W - 80, 168);
  ENDING.forEach((l, i) => { if (t > i * 20) drawText(ctx, l, W / 2, 22 + i * 13, i === 0 ? '#ffd84a' : '#ffffff', 1, 0.5); });
  if (t > 180) {
    drawText(ctx, 'ЗОЛОТЫХ КАЛПАКОВ: ' + game.kalTotal + ' ИЗ 30', W / 2, 132, '#ffd84a', 1, 0.5);
    if (game.kalTotal >= 30) drawText(ctx, 'ЭРМЕК - ЛЕГЕНДА БАЗАРА! +50000', W / 2, 144, '#9fe0ff', 1, 0.5);
    drawText(ctx, 'ИТОГО ОЧКОВ: ' + game.score + '   СПАСИБО ЗА ИГРУ!', W / 2, 160, '#ffffff', 1, 0.5);
  }
  if (t > 240 && (t >> 5) % 2 === 0) drawText(ctx, 'НАЖМИ ЛЮБУЮ СТРЕЛКУ', W / 2, 250, '#ffffff', 1, 0.5, '#000');
}

// ============================================================
//  GAME FLOW
// ============================================================
const SAVE_KEY = 'ermek-save-v2';
const game = {
  state: 'title', t: 0, score: 0, lives: 3, checks: 0, time: 0, li: 0, hero: null, checkpoint: null,
  paused: false, card: 0, finishing: false, finishT: 0, fade: 0, bossBar: false, tb: 0, cb: 0, kb: 0, tallyDone: false, hi: 0,
  wallet: 0, carry: {}, kalGot: new Set(), kalTotal: 0, menuSel: 0, saveData: null, bonus: null, bonusNext: false,
  titleTex: null, endTex: null,

  newGame() {
    this.score = 0; this.lives = 3; this.wallet = 0; this.carry = {}; this.kalTotal = 0;
    this.loadZone(0, null);
  },
  continueGame() {
    const s = this.saveData;
    this.score = s.score; this.lives = Math.max(3, s.lives); this.wallet = s.wallet; this.carry = s.carry || {}; this.kalTotal = s.kalTotal;
    this.loadZone(s.li, null);
  },
  loadZone(li, cp) {
    const fresh = !cp;
    this.li = li;
    world = newWorld(li);
    if (fresh) this.kalGot = new Set();
    world.kalpaks.forEach((k, i) => { k.id = i; if (this.kalGot.has(i)) k.got = true; });
    this.checkpoint = cp;
    const x = cp ? cp.x : 80;
    this.hero = newHero(x, world.ground.at(x));
    this.hero.bh = 54;
    if (cp) for (const c of world.cps) if (c.x <= cp.x) c.on = true;
    this.time = cp ? cp.time : 0;
    this.checks = 0; this.finishing = false; this.bossBar = false;
    this.card = cp ? 200 : 0;
    this.state = 'play'; this.paused = false;
    this.fade = 30;
    if (fresh) {
      const c = this.carry;
      if (c.shield) this.hero.shield = true;
      if (c.shoes) this.hero.shoes = 900;
      if (c.magnet) this.hero.magnet = true;
      this.carry = {};
      this.save();
    }
    updateCamera(true);
  },
  finishZone() {
    if (this.finishing) return;
    this.finishing = true; this.finishT = 0;
    this.hero.lock = 100000;
    this.bossBar = false;
    const s = this.time / 60, par = 60 + this.li * 6;
    this.tb = s < par ? 10000 : s < par * 1.5 ? 5000 : s < par * 2 ? 3000 : s < par * 3 ? 1000 : 0;
    this.cb = this.checks * 100;
    this.kb = this.kalGot.size * 1000;
    this.kalTotal += this.kalGot.size;
    this.wallet += this.checks;
    this.bonusNext = this.checks >= 50;
  },
  save() {
    const d = { li: this.li, score: this.score, lives: this.lives, wallet: this.wallet, carry: {}, kalTotal: this.kalTotal };
    this.saveData = d;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(d)); } catch (e) { }
  },
  clearSave() { this.saveData = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) { } },
  saveHi() {
    if (this.score > this.hi) { this.hi = this.score; try { localStorage.setItem('ermek-hi', String(this.hi)); } catch (e) { } }
  },
};
try { game.hi = parseInt(localStorage.getItem('ermek-hi') || '0', 10) || 0; } catch (e) { game.hi = 0; }
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && s.li >= 0 && s.li < LEVELS.length) { game.saveData = s; game.menuSel = 1; } } catch (e) { }

function afterBonus() {
  game.saveHi();
  if (game.li >= LEVELS.length - 1) {
    if (game.kalTotal >= 30) game.score += 50000;
    game.saveHi(); game.clearSave();
    game.state = 'ending'; game.t = 0;
  } else startShop();
}

function updateCamera(snap) {
  const h = game.hero, w = world, G = w.ground;
  const tx = h.x - W / 2 + clamp(h.vx * 10, -60, 60);
  const ty = h.y - H * 0.62;
  if (snap) { w.camX = tx; w.camY = ty; }
  else if (!h.dead) {
    w.camX += (tx - w.camX) * 0.2;
    w.camY += (ty - w.camY) * (h.onGround ? 0.16 : 0.1);
  }
  w.camX = clamp(w.camX, 0, w.end - W);
  if (w.lock) w.camX = clamp(w.camX + (w.lock.x0 - w.camX) * 0.1, w.lock.x0 - 200, w.lock.x0);
  if (w.lock && Math.abs(w.camX - w.lock.x0) < 1) w.camX = w.lock.x0;
  w.camY = clamp(w.camY, G.minY - 300, G.maxY - 110);
}

function step() {
  const g = game;
  g.t++;
  if (g.state === 'title') {
    if (g.saveData) {
      if (pressed.up || pressed.down) g.menuSel = 1 - g.menuSel;
      if (pressed.right && g.t > 20) {
        if (g.menuSel === 1) g.continueGame();
        else { g.state = 'story'; g.t = 0; }
      }
    } else if (anyPressed() && g.t > 20) { g.state = 'story'; g.t = 0; }
  } else if (g.state === 'story') {
    if (anyPressed() && g.t > 10) { g.state = 'howto'; g.t = 0; }
  } else if (g.state === 'howto') {
    if (anyPressed() && g.t > 10) { g.newGame(); g.t = 0; }
  } else if (g.state === 'play') {
    if (pressed.pause) g.paused = !g.paused;
    if (g.paused) { clearPressed(); return; }
    if (g.fade > 0) g.fade--;
    const h = g.hero;
    if (g.card < 200) { g.card++; if (g.card < 70) h.lock = Math.max(h.lock, 1); }
    heroUpdate(h);
    if (world.lock && !h.dead) h.x = clamp(h.x, world.lock.x0 + 10, world.lock.x0 + W - 10);
    if (h.x < 10) { h.x = 10; h.vx = Math.max(0, h.vx); }
    updateWorld();
    updateCamera(false);
    if (!g.finishing && !h.dead && g.card > 60) {
      g.time++;
      if (g.time >= 10 * 3600 - 1) { killHero(h, 'time'); say(h, 'ВРЕМЯ ВЫШЛО!', 120); }
    }
    if (h.dead && h.deadT > 130) {
      g.lives--;
      if (g.lives > 0) g.loadZone(g.li, g.checkpoint || { x: 80, y: 0, time: 0 });
      else { g.saveHi(); g.state = 'gameover'; g.t = 0; }
    }
    if (g.finishing) {
      g.finishT++;
      if (g.finishT > (world.lv.boss ? 90 : 170)) { g.state = 'tally'; g.t = 0; g.tallyDone = false; }
    }
  } else if (g.state === 'tally') {
    if (g.t > 60 && !g.tallyDone) {
      const a = Math.min(g.tb, 100), b = Math.min(g.cb, 100), c = Math.min(g.kb, 100);
      g.tb -= a; g.cb -= b; g.kb -= c; g.score += a + b + c;
      if (anyPressed()) { g.score += g.tb + g.cb + g.kb; g.tb = g.cb = g.kb = 0; clearPressed(); }
      if (g.tb === 0 && g.cb === 0 && g.kb === 0) { g.tallyDone = true; g.t = 61; }
    }
    if (g.tallyDone && g.t > 100 && anyPressed()) {
      g.saveHi();
      if (g.bonusNext) startBonus(); else afterBonus();
    }
    world.t++;
  } else if (g.state === 'bonus') {
    updateBonus();
  } else if (g.state === 'shop') {
    updateShop();
  } else if (g.state === 'gameover') {
    if (g.t > 60 && anyPressed()) { g.state = 'title'; g.t = 0; g.menuSel = g.saveData ? 1 : 0; }
  } else if (g.state === 'ending') {
    if (g.t > 240 && anyPressed()) { g.state = 'title'; g.t = 0; g.menuSel = 0; }
  }
  clearPressed();
}

function render() {
  const g = game;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  if (g.state === 'title') drawTitle();
  else if (g.state === 'story') drawStory();
  else if (g.state === 'howto') drawHowto();
  else if (g.state === 'play' || g.state === 'tally') {
    drawWorld();
    drawHUD();
    if (g.state === 'play' && g.card < 150) drawTitleCard();
    if (g.state === 'tally') drawTally();
    if (g.paused) {
      px(ctx, 0, 0, W, H, '#00000088');
      drawText(ctx, 'ПАУЗА', W / 2, 110, '#ffd84a', 3, 0.5);
      drawText(ctx, 'ESC - ПРОДОЛЖИТЬ', W / 2, 145, '#ffffff', 1, 0.5);
    }
    if (g.fade > 0) { ctx.globalAlpha = g.fade / 30; px(ctx, 0, 0, W, H, '#000'); ctx.globalAlpha = 1; }
    if (g.hero.dead && g.hero.deadT > 100) { ctx.globalAlpha = Math.min(1, (g.hero.deadT - 100) / 30); px(ctx, 0, 0, W, H, '#000'); ctx.globalAlpha = 1; }
  } else if (g.state === 'bonus') drawBonus();
  else if (g.state === 'shop') drawShop();
  else if (g.state === 'gameover') drawGameOver();
  else if (g.state === 'ending') drawEnding();
}
// ============================================================
//  BOOT
// ============================================================
buildSprites();
buildBallFrames();
buildSprites2();
DECOR = buildDecor();
game.titleTex = buildGroundTex(0);
game.endTex = buildGroundTex(4);

let lastT = performance.now(), accT = 0;
const DT = 1000 / 60;
function frame(now) {
  accT += Math.min(250, now - lastT); lastT = now;
  let n = 0;
  while (accT >= DT && n < 5) { step(); accT -= DT; n++; }
  if (n === 5) accT = 0;
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
