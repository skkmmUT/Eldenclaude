<script>
'use strict';

// ============================================================
//  CORE
// ============================================================
const W = 480, H = 270;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fitScreen() {
  let s = Math.min(innerWidth / W, innerHeight / H);
  if (s >= 2) s = Math.floor(s);
  cv.style.width = Math.floor(W * s) + 'px';
  cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fitScreen);
fitScreen();

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0);
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = false;
  return [c, g];
}
const R = Math.round;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function rnd(seed) {
  let s = seed >>> 0;
  return () => {
    s = (s + 0x6D2B79F5) >>> 0;
    let t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const RNG = rnd(20261006);
const pick = arr => arr[Math.floor(RNG() * arr.length)];
function px(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(R(x), R(y), R(w), R(h)); }
function limb(g, x1, y1, x2, y2, t, c) {
  g.fillStyle = c;
  const n = Math.max(1, Math.ceil(Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1))));
  const o = Math.floor(t / 2);
  for (let i = 0; i <= n; i++) {
    const x = x1 + (x2 - x1) * i / n, y = y1 + (y2 - y1) * i / n;
    g.fillRect(R(x) - o, R(y) - o, t, t);
  }
}
function disc(g, cx, cy, r, c) {
  g.fillStyle = c;
  for (let y = -r; y <= r; y++) {
    const w = Math.floor(Math.sqrt(r * r - y * y + r * 0.6));
    g.fillRect(R(cx) - w, R(cy) + y, w * 2 + 1, 1);
  }
}

// ============================================================

  'Г': '##### #.... #.... #.... #.... #.... #....',
  'Д': '..##. .#.#. .#.#. .#.#. .#.#. ##### #...#',

  'У': '#...# #...# #...# .#### ....# #...# .###.',
  'Ф': '..#.. .###. #.#.# #.#.# #.#.# .###. ..#..',

  '×': '..... #...# .#.#. ..#.. .#.#. #...# .....',

  "'": '..#.. ..#.. ..... ..... ..... ..... .....',
  '(': '...#. ..#.. .#... .#... .#... ..#.. ...#.',
  ')': '.#... ..#.. ...#. ...#. ...#. ..#.. .#...',
  '/': '....# ....# ...#. ..#.. .#... #.... #....',
  '%': '##..# ##..# ...#. ..#.. .#... #..## #..##',
  '←': '..... ..#.. .#... ##### .#... ..#.. .....',
  '→': '..... ..#.. ...#. ##### ...#. ..#.. .....',
  '↑': '..#.. .###. #.#.# ..#.. ..#.. ..#.. .....',
  '↓': '..... ..#.. ..#.. ..#.. #.#.# .###. ..#..',
  '°': '.##.. #..#. .##.. ..... ..... ..... .....',
  '$': '..#.. .#### #.#.. .###. ..#.# ####. ..#..',
  '№': '#..#. ##.#. #.##. #..#. ..... .###. .....',
};
const GLYPH_ALIAS = { 'А': 'A', 'В': 'B', 'Е': 'E', 'Ё': 'E', 'К': 'K', 'М': 'M', 'Н': 'H', 'О': 'O',
  'Р': 'P', 'С': 'C', 'Т': 'T', 'Х': 'X', '—': '-', '–': '-', '…': '.' };
const NARROW = '.,!:\'"()';
const GLYPHS = {};
for (const ch in GLYPH_SRC) {
  const rows = GLYPH_SRC[ch].split(' ');
  let minC = 5, maxC = -1;
  rows.forEach(r => { for (let i = 0; i < 5; i++) if (r[i] === '#') { minC = Math.min(minC, i); maxC = Math.max(maxC, i); } });
  const narrow = NARROW.includes(ch);
  GLYPHS[ch] = { rows, off: narrow ? minC : 0, w: narrow ? maxC - minC + 1 : 5 };
}
function glyphOf(ch) {
  ch = ch.toUpperCase();
  if (GLYPH_ALIAS[ch]) ch = GLYPH_ALIAS[ch];
  return GLYPHS[ch] || null;
}
function textWidth(str) {
  let w = 0;
  for (const ch of str) {
    if (ch === ' ') { w += 4; continue; }
    const gl = glyphOf(ch);
    w += gl ? gl.w + 1 : 4;
  }
  return Math.max(0, w - 1);
}
const textCache = new Map();
function textImage(str, color, shadow) {
  const key = str + '|' + color + '|' + (shadow || '');
  let c = textCache.get(key);
  if (c) return c;
  if (textCache.size > 600) textCache.clear();
  const tw = textWidth(str) + 1, th = 8;
  let g;
  [c, g] = makeCanvas(tw, th);
  const paint = (col, ox, oy) => {
    g.fillStyle = col;
    let x = 0;
    for (const ch of str) {
      if (ch === ' ') { x += 4; continue; }
      const gl = glyphOf(ch);
      if (!gl) { x += 4; continue; }
      for (let r = 0; r < 7; r++) for (let i = 0; i < 5; i++)
        if (gl.rows[r][i] === '#') g.fillRect(x + i - gl.off + ox, r + oy, 1, 1);
      x += gl.w + 1;
    }
  };
  if (shadow) paint(shadow, 1, 1);
  paint(color, 0, 0);
  textCache.set(key, c);
  return c;
}
// align: 0 left, 0.5 center, 1 right
function drawText(g, str, x, y, color = '#fff', scale = 1, align = 0, shadow = '#000') {
  str = String(str);
  const img = textImage(str, color, shadow);
  const w = img.width * scale;
  g.drawImage(img, R(x - w * align), R(y), img.width * scale, img.height * scale);
}
function wrapText(str, maxChars) {
  const words = str.split(' '), lines = [];
  let cur = '';
  for (const w of words) {
    if (cur && (cur + ' ' + w).length > maxChars) { lines.push(cur); cur = w; }
    else cur = cur ? cur + ' ' + w : w;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ============================================================
//  INPUT (arrows; Esc / P = pause)
// ============================================================
const keys = { left: false, right: false, up: false, down: false };
const pressed = { left: false, right: false, up: false, down: false, pause: false };
const KEYMAP = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.key];
  if (k) {
    e.preventDefault();
    if (!keys[k]) pressed[k] = true;
    keys[k] = true;
  } else if (e.key === 'Escape' || e.key === 'p' || e.key === 'P' || e.key === 'з' || e.key === 'З') {
    pressed.pause = true;
  }
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.key];
  if (k) { e.preventDefault(); keys[k] = false; }
});
addEventListener('blur', () => {
  keys.left = keys.right = keys.up = keys.down = false;
  if (game && game.state === 'play') game.paused = true;
});
function clearPressed() { for (const k in pressed) pressed[k] = false; }
const anyPressed = () => pressed.left || pressed.right || pressed.up || pressed.down;

// ============================================================
//  HERO: ERMEK (appearance is defined only here)
// ============================================================
const ERMEK_LOOK = {
  skin: '#d9a36c', skinShade: '#a8713f',
  hair: '#1c1612', mustache: '#1c1612', eye: '#111111', mouth: '#7a2a20',
  hat: '#f4f0e3', hatShade: '#cbc3aa', hatTrim: '#1d1d1d', hatPattern: '#1d1d1d', tassel: '#d8342a',
  shirt: '#2f6fd8', shirtShade: '#1d4a9c', outline: '#0f234d',
  vest: '#b3302a', vestShade: '#7e1f1b', vestTrim: '#f0c84a',
  pants: '#3b3b4a', pantsShade: '#272731',
  shoe: '#f5f5f5', shoeStripe: '#d8342a', sole: '#5a5a5a',
  bag: '#8a5a2b', belt: '#3a2614',
};

function drawErmek(g, pose, ph, blink) {
  const L = ERMEK_LOOK;
  let by = 0, lean = 0, mouth = 'smile';
  let legB = [0.05, 0.05], legF = [-0.05, 0.05], armB = [0.2, 0.5], armF = [-0.15, 0.6];
  if (pose === 'run' || pose === 'dash') {
    const s = Math.sin(ph), c = Math.cos(ph);
    const k = pose === 'dash' ? 1.25 : 0.95;
    legF = [s * k, 0.25 + Math.max(0, c) * 1.3];
    legB = [-s * k, 0.25 + Math.max(0, -c) * 1.3];
    armF = [-s * 0.9 * k, 1.4]; armB = [s * 0.9 * k, 1.4];
    by = -Math.round(Math.abs(c)); lean = pose === 'dash' ? 2 : 1;
  } else if (pose === 'walk') {
    const s = Math.sin(ph), c = Math.cos(ph);
    legF = [s * 0.5, 0.1 + Math.max(0, c) * 0.6];
    legB = [-s * 0.5, 0.1 + Math.max(0, -c) * 0.6];
    armF = [-s * 0.5, 0.5]; armB = [s * 0.5, 0.5];
    by = -Math.round(Math.abs(c) * 0.6);
  } else if (pose === 'crouch') {
    by = 7; legF = [1.15, 2.3]; legB = [0.95, 1.9]; armF = [0.6, 0.9]; armB = [0.4, 0.9];
  } else if (pose === 'spring' || pose === 'victory') {
    legF = [0.1, 0.1]; legB = [-0.1, 0.25]; armF = [2.9, 0]; armB = [-2.9, 0];
    if (pose === 'victory') { armF = [2.5, -0.4]; armB = [-2.6, 0.3]; mouth = 'open'; }
  } else if (pose === 'fall') {
    legF = [0.35, 0.6]; legB = [-0.3, 0.4]; armF = [1.9, 0.4]; armB = [-1.9, -0.4];
  } else if (pose === 'hurt' || pose === 'dead') {
    legF = [0.7, 0.4]; legB = [-0.7, 0.4]; armF = [2.4, 0.5]; armB = [-2.4, -0.5]; mouth = 'o';
  } else if (pose === 'skid') {
    legF = [0.75, 0.05]; legB = [0.35, 0.5]; armF = [-1.2, 0.4]; armB = [-1.5, 0.3]; lean = -2; mouth = 'o';
  } else if (pose === 'idle') {
    armF = [-0.15, 0.6 + Math.sin(ph) * 0.1];
  }
  const hipY = -14 + by, shY = -25 + by;
  const leg = (a, b, col, x0) => {
    const kx = x0 + Math.sin(a) * 7, ky = hipY + Math.cos(a) * 7;
    const fx = kx + Math.sin(a - b) * 7, fy = ky + Math.cos(a - b) * 7;
    limb(g, x0, hipY, kx, ky, 3, col);
    limb(g, kx, ky, fx, fy, 3, col);
    const sx = R(fx), sy = R(fy);
    px(g, sx - 1, sy - 2, 5, 2, L.shoe);
    px(g, sx - 1, sy, 5, 1, L.sole);
    px(g, sx, sy - 1, 2, 1, L.shoeStripe);
  };
  const arm = (a, e, col, x0) => {
    const sx = x0 + lean * 0.5;
    const ex = sx + Math.sin(a) * 6, ey = shY + Math.cos(a) * 6;
    const hx = ex + Math.sin(a + e) * 5, hy = ey + Math.cos(a + e) * 5;
    limb(g, sx, shY, ex, ey, 3, col);
    limb(g, ex, ey, hx, hy, 2, col);
    px(g, hx - 1, hy - 1, 3, 3, L.skin);
  };
  arm(armB[0], armB[1], L.shirtShade, -2);
  leg(legB[0], legB[1], L.pantsShade, -1);
  // torso
  const tx = lean * 0.5, ty = -27 + by;
  px(g, tx - 5, ty, 10, 14, L.shirt);
  px(g, tx - 5, ty + 1, 7, 12, L.vest);
  px(g, tx - 5, ty + 1, 1, 12, L.vestShade);
  px(g, tx + 2, ty + 1, 1, 12, L.vestTrim);
  px(g, tx - 3, ty + 4, 1, 1, L.vestTrim); px(g, tx - 1, ty + 7, 1, 1, L.vestTrim); px(g, tx - 3, ty + 10, 1, 1, L.vestTrim);
  px(g, tx - 5, ty + 12, 10, 2, L.belt);
  px(g, tx - 8, ty + 9, 4, 5, L.bag); px(g, tx - 8, ty + 9, 4, 1, L.belt);
  leg(legF[0], legF[1], L.pants, 1);
  // head
  const hx = lean, hy = by;
  px(g, hx - 1, hy - 29, 3, 2, L.skinShade);
  px(g, hx - 3, hy - 35, 8, 7, L.skin);
  px(g, hx - 3, hy - 29, 7, 1, L.skinShade);
  px(g, hx - 4, hy - 35, 2, 6, L.hair);
  px(g, hx - 1, hy - 33, 2, 2, L.skinShade);
  px(g, hx + 5, hy - 32, 1, 2, L.skin);
  px(g, hx + 1, hy - 34, 3, 1, L.hair);
  if (blink) px(g, hx + 2, hy - 32, 2, 1, L.eye); else px(g, hx + 2, hy - 33, 1, 2, L.eye);
  px(g, hx + 2, hy - 30, 4, 1, L.mustache);
  if (mouth === 'o') px(g, hx + 3, hy - 29, 2, 2, L.mouth);
  else if (mouth === 'open') px(g, hx + 2, hy - 29, 3, 1, L.mouth);
  // ak-kalpak
  px(g, hx - 5, hy - 37, 11, 2, L.hatTrim);
  px(g, hx + 4, hy - 39, 2, 2, L.hatTrim);
  px(g, hx - 4, hy - 40, 8, 3, L.hat);
  px(g, hx - 3, hy - 43, 6, 3, L.hat);
  px(g, hx - 2, hy - 45, 4, 2, L.hat);
  px(g, hx - 1, hy - 46, 2, 1, L.hat);
  px(g, hx - 4, hy - 40, 1, 3, L.hatShade); px(g, hx - 3, hy - 43, 1, 3, L.hatShade); px(g, hx - 2, hy - 45, 1, 2, L.hatShade);
  px(g, hx - 2, hy - 39, 1, 1, L.hatPattern); px(g, hx, hy - 40, 1, 1, L.hatPattern); px(g, hx + 2, hy - 39, 1, 1, L.hatPattern);
  px(g, hx - 1, hy - 42, 1, 1, L.hatPattern); px(g, hx + 1, hy - 42, 1, 1, L.hatPattern);
  px(g, hx, hy - 48, 1, 2, L.tassel);
  arm(armF[0], armF[1], L.shirt, 2);
}

// rolled-up Ermek (spin ball), 8 rotation frames
const BALL_R = 11;
const BALL_FRAMES = [];
function buildBallFrames() {
  BALL_FRAMES.length = 0;
  const L = ERMEK_LOOK, d = BALL_R * 2 + 3;
  for (let f = 0; f < 8; f++) {
    const [c, g] = makeCanvas(d, d);
    const rot = f / 8 * Math.PI * 2, cx = d / 2 - 0.5, cy = d / 2 - 0.5;
    for (let y = 0; y < d; y++) for (let x = 0; x < d; x++) {
      const dx = x - cx, dy = y - cy, r = Math.hypot(dx, dy);
      if (r > BALL_R + 0.5) continue;
      let a = Math.atan2(dy, dx) - rot; a = ((a % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      let col;
      if (r > BALL_R - 0.6) col = L.outline;
      else if (a < 0.9 && r > 5) col = r > 8 ? L.hatTrim : L.hat;
      else if (a > 0.9 && a < 1.5 && r > 5) col = L.skin;
      else if (a > 3.2 && a < 4.0 && r > 6) col = L.vest;
      else col = (Math.floor(a / (Math.PI / 3) + r / 6) % 2) ? L.shirt : L.shirtShade;
      if (dx < -2 && dy < -2 && r > 4 && r < 7 && col !== L.outline) col = '#8fb4ff';
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
    BALL_FRAMES.push(c);
  }
}

// ============================================================
//  ENEMIES & BOSS SPRITES
// ============================================================
const LYUDA = { coat: '#c4508c', coatShade: '#8e3364', hair: '#f7d84c', hairShade: '#d1a82a', skin: '#efc29e',
  legs: '#e0b49a', shoe: '#2a1a1a', bag: '#7a1f2b', lips: '#d22d3d', glasses: '#333' };
const KESHA = { body: '#38b84a', bodyShade: '#23853a', head: '#f4e04d', tail: '#2d6fd0', beak: '#f08a24' };

function drawParrot(g, x, y, flap, flip) {
  g.save(); g.translate(R(x), R(y)); if (flip) g.scale(-1, 1);
  px(g, -3, -2, 6, 4, KESHA.body);
  px(g, -3, 1, 6, 1, KESHA.bodyShade);
  px(g, 2, -4, 4, 4, KESHA.head);
  px(g, 4, -3, 1, 1, '#111');

const LOOP_IMGS = {};
function loopImage(r, colA, colB, edge) {
  const key = r + colA + colB;
  if (LOOP_IMGS[key]) return LOOP_IMGS[key];
  const T = 9, s = (r + T) * 2 + 2;
  const [c, g] = makeCanvas(s, s);
  const cx = s / 2, cy = s / 2;
  for (let y = 0; y < s; y++) for (let x = 0; x < s; x++) {
    const d = Math.hypot(x - cx + 0.5, y - cy + 0.5);
    if (d < r || d > r + T) continue;
    const a = Math.atan2(y - cy, x - cx);
    let col = (Math.floor(a / (Math.PI / 16) + 16) + Math.floor((d - r) / 4.5)) % 2 ? colA : colB;
    if (d < r + 1.5) col = edge;
    g.fillStyle = col; g.fillRect(x, y, 1, 1);
  }
  LOOP_IMGS[key] = c;
  return c;
}

function buildSky(z) {
  const [c, g] = makeCanvas(W, H);
  const cols = z.sky;
  for (let y = 0; y < H; y++) {
    const t = y / (H - 1) * (cols.length - 1);
    const i = Math.min(cols.length - 2, Math.floor(t));
    const f = t - i;
    // dithered banding, 16-bit style
    for (let x = 0; x < W; x += 2) {
      const d = ((x >> 1) + y) % 2 ? 0.12 : -0.12;
      g.fillStyle = f + d > 0.5 ? cols[i + 1] : cols[i];
      g.fillRect(x, y, 2, 1);
    }
  }
  return c;
}

function buildMountains(w, h, base, cols, seed, amp, snow) {
  const [c, g] = makeCanvas(w, h);
  const r = rnd(seed);
  const ph = [r() * 6, r() * 6, r() * 6, r() * 6];
  const ridge = x => {
    const t = x / w * Math.PI * 2;
    return base - amp * (0.55 * Math.abs(Math.sin(t * 2 + ph[0])) + 0.3 * Math.sin(t * 5 + ph[1])
      + 0.12 * Math.sin(t * 13 + ph[2]) + 0.05 * Math.sin(t * 31 + ph[3]));
  };
  for (let x = 0; x < w; x++) {
    const top = R(ridge(x)), slope = ridge(x + 1) - ridge(x - 1);
    const sn = snow ? top + 8 + R(5 * Math.sin(x * 0.21) + 3 * Math.sin(x * 0.07)) : -1;
    for (let y = Math.max(0, top); y < h; y++) {
      let col = slope > 0 ? cols[1] : cols[0];
      if (snow && y < sn && top < base - amp * 0.45) col = slope > 0 ? '#c9d6ea' : '#f4f8ff';
      g.fillStyle = col; g.fillRect(x, y, 1, 1);
    }
  }
  return c;
}

function drawFlag(g, x, y, t) {
  for (let i = 0; i < 16; i++) {
    const oy = R(Math.sin(t * 0.12 + i * 0.5) * 1.2);
    px(g, x + i, y + oy, 1, 10, '#e8112d');
    const dx = i - 7.5;
    for (let j = 0; j < 10; j++) {
      const dy = j - 4.5, d = Math.hypot(dx, dy);
      if (d < 3.6) { g.fillStyle = d < 2.2 ? '#ffef00' : '#ffd400'; if (d > 1.2 && d < 2.0) g.fillStyle = '#e8112d'; g.fillRect(x + i, y + oy + j, 1, 1); }
    }
  }
}

    px(g, x, h - bh, bw, bh, glass[0]);
    for (let yy = h - bh + 14; yy < h - 6; yy += 7) px(g, x + 3, yy, bw - 6, 4, glass[1]);
    for (let xx = x + 3; xx < x + bw - 3; xx += 12) px(g, xx, h - bh + 12, 1, bh - 12, glass[0]);
    // reflection diagonal
    for (let k = 0; k < 18; k++) px(g, x + 8 + k, h - bh + 20 + k * 2, 3, 2, '#ffffff55');
    // sign
    const name = BANK_NAMES[n % BANK_NAMES.length]; n++;
    const tw = textWidth(name) + 6;
    px(g, x + bw / 2 - tw / 2, h - bh - 12, tw, 11, '#1b2a44');
    px(g, x + bw / 2 - tw / 2, h - bh - 2, tw, 1, '#f0c84a');
    g.drawImage(textImage(name, '#ffd84a'), R(x + bw / 2 - tw / 2 + 3), h - bh - 10);
    px(g, x + bw / 2 - 1, h - bh - 2, 2, 2, '#333');
    x += bw + 8;
    if (n === 3) {
      // exchange-rate board
      px(g, x, h - 70, 64, 50, '#202020'); px(g, x + 2, h - 68, 60, 46, '#0a0a0a');
      g.drawImage(textImage('КУРС', '#ff5040'), x + 20, h - 66);
      g.drawImage(textImage('USD 87,4', '#3cff6a'), x + 6, h - 56);

      g.drawImage(textImage('КУРУТ 1:1', '#ffd84a'), x + 4, h - 38);
      px(g, x + 30, h - 20, 4, 20, '#555');

  }
  return c;
}

function buildMarketRow(seed) {
  const w = 960, h = 96, [c, g] = makeCanvas(w, h), r = rnd(seed);
  const signs = ['КУРУТ', 'САМСА', 'ДЫНИ', 'КАЛПАКИ', 'ШЫРДАК', 'УРЮК', 'ЧАЙ', 'БОРСОК'];
  let x = 4, n = 0;
  while (x < w - 70) {
    const sw = 64 + R(r() * 16);
    const [a, b] = pick([['#e8352a', '#fff3e0'], ['#2b6fd8', '#fff3e0'], ['#2f9a46', '#fff3e0'], ['#f0a020', '#7a2a10']]);
    px(g, x + 2, h - 50, 2, 50, '#6a4a2a'); px(g, x + sw - 4, h - 50, 2, 50, '#6a4a2a');
    for (let i = 0; i < sw; i++) px(g, x + i, h - 60, 1, 10, Math.floor(i / 8) % 2 ? a : b);
    for (let i = 0; i < sw; i += 8) { px(g, x + i, h - 50, 8, 2, Math.floor(i / 8) % 2 ? a : b); px(g, x + i + 2, h - 48, 4, 1, Math.floor(i / 8) % 2 ? a : b); }
    px(g, x, h - 26, sw, 26, '#8a5a2b'); px(g, x, h - 26, sw, 3, '#a8763f');
    for (let i = 0; i < sw - 8; i += 4) {
      const col = pick(['#e33', '#f90', '#fc3', '#9c3', '#f2f2e6', '#a35']);
      disc(g, x + 6 + i, h - 30 - (i % 8 ? 0 : 3), 2, col);
    }
    if (r() < 0.5) { // hanging carpet
      px(g, x + 10, h - 47, 20, 16, '#9b1c2c'); px(g, x + 12, h - 45, 16, 12, '#d9a03a');
      px(g, x + 17, h - 42, 6, 6, '#9b1c2c'); px(g, x + 19, h - 40, 2, 2, '#fff');

    g.drawImage(textImage(s, '#a0221c'), R(x + sw / 2 - tw / 2 + 3), h - 70);
    x += sw + 8 + R(r() * 12);

function buildStreet(seed, night) {
  const w = 960, h = 100, [c, g] = makeCanvas(w, h), r = rnd(seed);
  px(g, 0, h - 22, w, 22, '#55555e');
  for (let x = 0; x < w; x += 40) px(g, x, h - 12, 20, 2, '#e8e8e8');
  px(g, 0, h - 24, w, 3, '#9a9aa2');
  let x = 10;
  while (x < w - 70) {
    const k = r();
    if (k < 0.45) { // tree
      px(g, x + 6, h - 50, 3, 26, '#5a4030');
      disc(g, x + 7, h - 58, 11, '#3f8a3a'); disc(g, x + 4, h - 62, 6, '#4fa548'); disc(g, x + 12, h - 54, 5, '#357a30');
      x += 34;
    } else if (k < 0.88) { // lamp
      (c.lamps = c.lamps || []).push([x + 12, h - 68]);
      px(g, x + 3, h - 70, 2, 46, '#3a3a42'); px(g, x + 3, h - 70, 10, 2, '#3a3a42'); px(g, x + 10, h - 69, 5, 3, '#ffe9a0');
      x += 30;
    } else { // bus stop
      px(g, x, h - 48, 46, 3, '#2b6fd8'); px(g, x + 2, h - 45, 2, 21, '#777'); px(g, x + 42, h - 45, 2, 21, '#777');
      px(g, x + 6, h - 44, 34, 16, '#9fd0f0aa'); px(g, x + 8, h - 32, 30, 3, '#6a4a2a');
      px(g, x - 4, h - 58, 54, 10, '#2b6fd8');
      g.drawImage(textImage('ОСТАНОВКА', '#fff'), x - 3, h - 57);
      x += 64;
    }
    x += R(r() * 20);
  }
  return c;
}

function buildShore(seed) {
  const w = 960, h = 70, [c, g] = makeCanvas(w, h), r = rnd(seed);
  px(g, 0, h - 26, w, 26, '#e9c98a');
  for (let i = 0; i < 300; i++) px(g, R(r() * w), h - 26 + R(r() * 26), 1, 1, '#c9a868');
  px(g, 0, h - 27, w, 2, '#fff5d8');
  let x = 10;
  while (x < w - 40) {
    const k = r();
    if (k < 0.4) { // yurt
      px(g, x, h - 42, 40, 18, '#f2ecdc'); px(g, x, h - 30, 40, 2, '#b8322c');
      for (let yy = 0; yy < 12; yy++) { const hw = R(20 - yy * 1.5); px(g, x + 20 - hw, h - 42 - yy, hw * 2, 1, yy < 2 ? '#d8d0bc' : '#f8f2e4'); }
      px(g, x + 17, h - 55, 6, 2, '#8a5a2b');
      px(g, x + 15, h - 38, 10, 14, '#a8322c'); px(g, x + 17, h - 36, 6, 12, '#d9a03a');
      for (let i = 0; i < 40; i += 6) px(g, x + i, h - 44, 3, 2, '#b8322c');
      x += 52;
    } else if (k < 0.75) { // umbrella
      px(g, x + 10, h - 50, 2, 26, '#ddd');
      const col = pick(['#e8352a', '#2b6fd8', '#f0c020']);
      for (let yy = 0; yy < 8; yy++) { const hw = R(3 + yy * 1.6); px(g, x + 11 - hw, h - 56 + yy, hw * 2, 1, yy % 2 ? col : '#fff'); }
      px(g, x + 2, h - 28, 16, 3, '#2b6fd8');
      x += 30;
    } else { // kymyz stand
      px(g, x, h - 44, 34, 20, '#8a5a2b'); px(g, x, h - 48, 34, 4, '#2f9a46');
      g.drawImage(textImage('КЫМЫЗ', '#fff'), x + 3, h - 40);
      x += 44;
    }
    x += R(r() * 26);
  }
  return c;
}

function buildBushes(seed, berries) {
  const w = 960, h = 100, [c, g] = makeCanvas(w, h), r = rnd(seed);
  for (let x = -10; x < w + 10; x += 18 + R(r() * 18)) {
    const rr = 10 + R(r() * 8);
    disc(g, x, h - rr + 4, rr, '#3c7a3a'); disc(g, x - 3, h - rr + 1, rr - 4, '#4f9a48');
    if (berries) for (let i = 0; i < 10; i++) px(g, x + R((r() - 0.5) * rr * 1.6), h - rr + R((r() - 0.3) * rr), 2, 2, '#ff9a1a');
    if (r() < 0.3) {
      const th = 60 + R(r() * 30);
      for (let yy = 0; yy < th; yy++) { const hw = R(Math.sin(Math.PI * yy / th) * 7) + 1; px(g, x + 8 - hw, h - 10 - yy, hw * 2, 1, yy % 6 < 3 ? '#2f6a2e' : '#3a7a36'); }
    }
  }
  return c;
}

function buildCloud(r) {
  const w = 40 + R(r() * 40), [c, g] = makeCanvas(w + 8, 26);
  for (let i = 0; i < 5; i++) disc(g, 8 + R(r() * (w - 12)), 16 - R(r() * 6), 6 + R(r() * 5), '#ffffff');
  px(g, 4, 18, w, 6, '#ffffff');
  for (let x = 4; x < w + 4; x++) px(g, x, 23, 1, 2, '#dfe8f2');
  return c;
}

function drawMarshrutka(g, x, y, dir, num, t) {
  g.save(); g.translate(R(x), R(y)); if (dir < 0) g.scale(-1, 1);
  px(g, -22, -18, 44, 15, '#f2d23a'); px(g, -22, -18, 44, 2, '#fff2a0');
  px(g, 12, -16, 10, 7, '#9fd0f0'); px(g, 20, -10, 3, 5, '#f2d23a');
  for (let i = -18; i < 10; i += 8) px(g, i, -15, 6, 5, '#9fd0f0');
  px(g, -22, -8, 44, 2, '#c0392b');
  g.restore();
  // number plate stays readable
  drawText(g, num, R(x) - 6, R(y) - 26, '#111', 1, 0, null);
  disc(g, x - 13, y - 3, 3, '#222'); disc(g, x + 13, y - 3, 3, '#222');
  px(g, x - 14, y - 4, 2, 2, '#888'); px(g, x + 12, y - 4, 2, 2, '#888');
}


function darken(img, a) {
  const [c, g] = makeCanvas(img.width, img.height);
  g.drawImage(img, 0, 0);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = `rgba(12,16,52,${a})`; g.fillRect(0, 0, c.width, c.height);
  return [c, g];
}

function buildNightBanks(seed) {
  const [c, g] = darken(buildBanks(seed), 0.62);
  const r = rnd(seed + 5);
  g.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < 520; i++) {
    const x = R(r() * c.width), y = 20 + R(r() * (c.height - 20));
    g.fillStyle = r() < 0.7 ? '#ffe39a' : '#9fd8ff';
    g.fillRect(x, y, 3, 2);
  }
  // re-draw bank signs so they glow
  return c;
}

function buildContainers(seed) {
  const w = 960, h = 150, [c, g] = makeCanvas(w, h), r = rnd(seed);
  const cols = ['#c0392b', '#2b6fd8', '#2f9a46', '#e8a020', '#7a7a82', '#8a3a8a', '#1f8a8a'];
  let x = 0, n = 0;
  while (x < w - 64) {
    const stack = 1 + Math.floor(r() * 3.4);
    for (let k = 0; k < stack; k++) {
      const col = cols[Math.floor(r() * cols.length)], y = h - 26 * (k + 1);
      px(g, x, y, 62, 25, col);
      for (let i = 2; i < 62; i += 4) px(g, x + i, y + 2, 1, 21, '#00000033');
      px(g, x, y, 62, 2, '#ffffff33'); px(g, x + 56, y + 4, 4, 17, '#00000044');
      if (r() < 0.25) g.drawImage(textImage('К-' + (100 + Math.floor(r() * 400)), '#ffffffcc'), x + 6, y + 9);
    }
    if (r() < 0.25 && n++ % 2 === 0) {
      const sy = h - 26 * stack - 14;
      px(g, x + 2, sy, 58, 12, '#1a1a1a'); px(g, x + 3, sy + 1, 56, 10, '#2f9a46');
      g.drawImage(textImage(pick(['ДОРДОЙ', 'ОПТОМ', 'ВСЁ ЕСТЬ']), '#fff'), x + 6, sy + 2);
    }
    x += 64;
    if (r() < 0.12) { // gantry crane
      px(g, x, h - 140, 4, 140, '#e8b030'); px(g, x + 40, h - 140, 4, 140, '#e8b030'); px(g, x - 6, h - 142, 56, 5, '#e8b030');
      for (let yy = h - 130; yy < h; yy += 14) limb(g, x + 2, yy, x + 42, yy + 12, 1, '#c08a20');
      px(g, x + 18, h - 137, 2, 30, '#333'); px(g, x + 12, h - 107, 14, 4, '#555');
      x += 50;
    }
  }
  return c;
}

function buildClothesRow(seed) {
  const w = 960, h = 96, [c, g] = makeCanvas(w, h), r = rnd(seed);
  let x = 4;
  while (x < w - 80) {
    const sw = 70 + R(r() * 20);
    const tarp = pick(['#2b6fd8', '#2f9a46', '#c0392b', '#7a7a82']);
    px(g, x + 2, h - 62, 2, 62, '#555'); px(g, x + sw - 4, h - 62, 2, 62, '#555');
    px(g, x - 2, h - 68, sw + 4, 8, tarp); px(g, x - 2, h - 61, sw + 4, 1, '#00000055');
    px(g, x + 4, h - 54, sw - 8, 1, '#333');
    for (let i = x + 8; i < x + sw - 12; i += 12) {
      const k = r(), col = pick(['#e33', '#fc3', '#3a8', '#36c', '#f6f', '#fff', '#222']);
      if (k < 0.4) { px(g, i, h - 53, 10, 4, col); px(g, i + 2, h - 49, 6, 10, col); }
      else if (k < 0.7) { px(g, i + 1, h - 53, 8, 4, '#3a5a9a'); px(g, i + 1, h - 49, 3, 14, '#3a5a9a'); px(g, i + 6, h - 49, 3, 14, '#3a5a9a'); }
      else { for (let yy = 0; yy < 14; yy++) px(g, i + 5 - R(yy * 0.3), h - 53 + yy, 2 + R(yy * 0.6), 1, col); }
    }
    px(g, x, h - 22, sw, 22, '#8a7a6a'); px(g, x, h - 22, sw, 2, '#a89a88');
    for (let i = 0; i < sw - 16; i += 14) {
      for (let a = 0; a < 10; a++) for (let b2 = 0; b2 < 8; b2++) px(g, x + 6 + i + a, h - 31 + b2, 1, 1, ((a >> 1) + (b2 >> 1)) % 2 ? '#2b6fd8' : '#eee');
    }
    if (r() < 0.4) { const t = 'ОПТОМ'; px(g, x + sw / 2 - 18, h - 80, 36, 11, '#fff'); g.drawImage(textImage(t, '#c0392b'), R(x + sw / 2 - 15), h - 78); }
    x += sw + 10 + R(r() * 12);
  }
  return c;
}

function fir(g, x, base, hgt, a, b) {
  px(g, x - 1, base - 6, 3, 6, '#4a3020');
  for (let y = 0; y < hgt; y++) {
    const tier = (y % 12) / 12, hw = R((y / hgt) * hgt * 0.32 * (0.6 + tier * 0.5)) + 1;
    px(g, x - hw, base - hgt - 4 + y, hw * 2 + 1, 1, y % 12 < 6 ? a : b);
  }
}

function buildForest(seed, snow) {
  const w = 960, h = 150, [c, g] = makeCanvas(w, h), r = rnd(seed);
  for (let x = -10; x < w + 10; x += 10 + R(r() * 12)) fir(g, x, h - 10, 50 + R(r() * 40), '#2a5a3a', '#244e33');
  for (let x = -10; x < w + 10; x += 14 + R(r() * 16)) {
    const hh = 70 + R(r() * 60);
    fir(g, x, h, hh, '#1f4a2e', '#1a3f27');
    if (snow) for (let k = 0; k < 4; k++) px(g, x - 2 - k, h - hh - 2 + k * 12, 5 + k * 2, 2, '#f4f8ff');
  }
  px(g, 0, h - 6, w, 6, '#1a3f27');
  return c;
}

function buildRocks(seed, snow) {
  const w = 960, h = 110, [c, g] = makeCanvas(w, h), r = rnd(seed);
  for (let x = 0; x < w; x += 30 + R(r() * 40)) {
    const rw = 20 + R(r() * 30), rh = 14 + R(r() * 22);
    for (let y = 0; y < rh; y++) {
      const hw = R(rw * Math.sqrt(1 - (1 - y / rh) ** 2) / 2) + 2;
      px(g, x - hw, h - rh + y, hw * 2, 1, y < 3 && snow ? '#f4f8ff' : y < rh * 0.4 ? '#9aa0a8' : '#7a8088');
      px(g, x - hw, h - rh + y, 2, 1, '#5a6068');
    }
    if (r() < 0.35) fir(g, x + 18, h, 50 + R(r() * 40), '#2f6a3a', '#285c32');
  }
  // waterfall
  const wx = 600;
  px(g, wx, 0, 12, h, '#cfeaff'); for (let y = 0; y < h; y += 6) px(g, wx + 2 + (y % 5), y, 2, 4, '#ffffff');
  return c;
}

function buildBackground(th, lv) {
  lv = lv || {};
  const z = ZONES[th], night = !!lv.night;
  const bg = { sky: buildSky(night ? { sky: z.skyNight } : z), layers: [], clouds: [], th, night };
  const r = rnd(1000 + th * 77);
  const mt = (w, h, base, cols, seed, amp, snow) => {
    const img = buildMountains(w, h, base, cols, seed, amp, snow);
    return night ? darken(img, 0.55)[0] : img;
  };
  if (th === 0) {
    bg.layers.push({ img: mt(960, 130, 120, z.mFar, 11, 85, true), fx: 0.04, y: 40, fy: 0.02 });
    bg.layers.push({ img: mt(960, 110, 108, z.mNear, 12, 45, false), fx: 0.1, y: 80, fy: 0.04 });
    bg.layers.push({ img: buildCity(13), fx: 0.25, y: 50, fy: 0.12, fill: '#c8b9a0', flag: 150 });
    bg.layers.push({ img: buildMarketRow(14), fx: 0.5, y: 84, fy: 0.3, fill: '#b39468', stripe: '#9c7f55' });
  } else if (th === 1) {
    bg.layers.push({ img: mt(960, 130, 120, z.mFar, 21, 90, true), fx: 0.04, y: 34, fy: 0.02 });
    bg.layers.push({ img: night ? buildNightBanks(22) : buildBanks(22), fx: 0.22, y: 20, fy: 0.12, fill: night ? '#1d2440' : '#6b7fb8', flag: 520 });
    const st0 = buildStreet(23), st = night ? darken(st0, 0.45)[0] : st0;
    if (night) {
      const sg = st.getContext('2d');
      for (const [lx, ly] of st0.lamps || []) {
        sg.save(); sg.globalAlpha = 0.22; disc(sg, lx, ly + 2, 10, '#fff0a0'); sg.globalAlpha = 0.35; disc(sg, lx, ly + 2, 5, '#fff6c8'); sg.restore();
        px(sg, lx - 2, ly + 1, 5, 3, '#fff6c8');
      }
    }
    bg.layers.push({ img: st, fx: 0.5, y: 68, fy: 0.3, fill: night ? '#3a3a48' : '#8e8e96', stripe: night ? '#30303c' : '#7a7a82', street: true });
  } else if (th === 2) {
    bg.layers.push({ img: mt(960, 130, 120, z.mFar, 41, 80, true), fx: 0.04, y: 30, fy: 0.02 });
    bg.layers.push({ img: buildContainers(42), fx: 0.22, y: 40, fy: 0.12, fill: '#8a8a84' });
    bg.layers.push({ img: buildClothesRow(43), fx: 0.5, y: 80, fy: 0.3, fill: '#a8a8a0', stripe: '#96968e' });
  } else if (th === 3) {
    bg.layers.push({ img: mt(960, 160, 150, z.mFar, 51, 125, true), fx: 0.03, y: -10, fy: 0.02 });
    bg.layers.push({ img: mt(960, 120, 110, z.mNear, 52, 60, !!lv.snow), fx: 0.08, y: 50, fy: 0.05 });
    bg.layers.push({ img: buildForest(53, !!lv.snow), fx: 0.25, y: 50, fy: 0.12, fill: '#1a3f27' });
    bg.layers.push({ img: buildRocks(54, !!lv.snow), fx: 0.5, y: 96, fy: 0.3, fill: lv.snow ? '#c8d4e0' : '#4a6a3a', stripe: lv.snow ? '#b4c2d2' : '#42603a' });
  } else {
    bg.layers.push({ img: mt(960, 120, 110, z.mFar, 31, 80, true), fx: 0.03, y: -12, fy: 0.02, lake: true });
    bg.layers.push({ img: buildShore(32), fx: 0.3, y: 112, fy: 0.15, fill: '#e9c98a' });
    bg.layers.push({ img: buildBushes(33, true), fx: 0.55, y: 104, fy: 0.3, fill: '#3c7a3a', stripe: '#346d33' });
  }
  for (let i = 0; i < 7; i++) bg.clouds.push({ img: buildCloud(r), x: r() * 1400, y: 8 + r() * 70, v: 0.05 + r() * 0.12 });
  bg.stars = [];
  for (let i = 0; i < 70; i++) bg.stars.push({ x: R(r() * W), y: R(r() * 150), p: r() * 6 });
  bg.boats = [];
  for (let i = 0; i < 4; i++) bg.boats.push({ x: r() * 960, v: 0.04 + r() * 0.06, s: r() < 0.5 });
  bg.cars = [];
  for (let i = 0; i < 3; i++) bg.cars.push({ x: r() * 960, v: (r() < 0.5 ? 1 : -1) * (0.6 + r() * 0.6), n: pick(['110', '212', '135', '144']) });
  bg.birds = [];
  for (let i = 0; i < 5; i++) bg.birds.push({ x: r() * 900, y: 30 + r() * 50, v: 0.3 + r() * 0.3, p: r() * 6 });
  return bg;
}

function drawBackground(g, bg, camX, camY, t) {
  g.drawImage(bg.sky, 0, 0);
  const th = bg.th, night = bg.night;
  const dy = (camY - 233);
  if (night) {
    for (const s of bg.stars) if (Math.sin(t * 0.05 + s.p) > -0.6) px(g, s.x, s.y, 1, 1, '#fffbe0');
    disc(g, 90, 36, 11, '#fff6d0'); disc(g, 95, 32, 10, '#141c45');
  } else if (th === 0 || th === 2) disc(g, 400, 34 - dy * 0.01, 14, '#fff6c8');
  else if (th === 1 || th === 3) disc(g, 70, 30, 12, '#fffbe0');
  else { disc(g, 330, 70 - dy * 0.02, 22, '#ffd27a'); disc(g, 330, 70 - dy * 0.02, 17, '#fff0b0'); }
  g.save();
  if (night) g.globalAlpha = 0.25;

// ============================================================
//  LEVEL GEOMETRY
// ============================================================
class Ground {
  constructor(runs) {
    this.runs = runs.filter(r => r.length > 1).map(pts => ({ pts, x0: pts[0][0], x1: pts[pts.length - 1][0] }));
    this.pits = [];
    for (let i = 0; i < this.runs.length - 1; i++) {
      const a = this.runs[i], b = this.runs[i + 1];
      this.pits.push({ x0: a.x1, x1: b.x0, y: Math.max(a.pts[a.pts.length - 1][1], b.pts[0][1]) });
    }
    this.maxY = Math.max(...this.runs.flatMap(r => r.pts.map(p => p[1])));
    this.minY = Math.min(...this.runs.flatMap(r => r.pts.map(p => p[1])));
  }
  seg(x) {
    const rs = this.runs;
    let lo = 0, hi = rs.length - 1, run = null;
    while (lo <= hi) {
      const m = (lo + hi) >> 1, r = rs[m];
      if (x < r.x0) hi = m - 1; else if (x >= r.x1) lo = m + 1; else { run = r; break; }
    }
    if (!run) return null;
    const p = run.pts;
    let a = 0, b = p.length - 1;
    while (b - a > 1) { const m = (a + b) >> 1; if (p[m][0] <= x) a = m; else b = m; }
    while (a < p.length - 1 && p[a + 1][0] <= x) a++;
    if (a >= p.length - 1) return null;
    return [p[a], p[a + 1]];
  }
  at(x) {
    const s = this.seg(x);
    if (!s) return null;
    const [p, q] = s;
    if (q[0] === p[0]) return q[1];
    return p[1] + (q[1] - p[1]) * (x - p[0]) / (q[0] - p[0]);
  }
  slope(x) {
    const s = this.seg(x);
    if (!s) return 0;
    const [p, q] = s;
    return q[0] === p[0] ? 0 : (q[1] - p[1]) / (q[0] - p[0]);
  }
}

class Builder {
  constructor(y0) { this.runs = []; this.cur = [[-400, y0], [0, y0]]; this.x = 0; this.y = y0; this.objs = []; }
  pt() { this.cur.push([this.x, this.y]); }
  flat(n) { this.x += n; this.pt(); return this; }
  curve(n, dy, seg = 12) {
    const x0 = this.x, y0 = this.y;
    for (let i = 1; i <= seg; i++) { const t = i / seg; this.cur.push([x0 + n * t, y0 + dy * (1 - Math.cos(Math.PI * t)) / 2]); }
    this.x += n; this.y += dy; return this;
  }
  hill(n, h, seg = 16) {
    const x0 = this.x, y0 = this.y;
    for (let i = 1; i <= seg; i++) { const t = i / seg; this.cur.push([x0 + n * t, y0 - h * (1 - Math.cos(2 * Math.PI * t)) / 2]); }
    this.x += n; return this;
  }
  ramp(n, h, seg = 10) {
    const x0 = this.x, y0 = this.y;
    for (let i = 1; i <= seg; i++) { const t = i / seg; this.cur.push([x0 + n * t, y0 - h * (1 - Math.cos(Math.PI / 2 * t))]); }
    this.x += n; this.cur.push([this.x, y0]); return this;
  }
  step(dy) { this.y += dy; this.pt(); return this; }
  pit(n) { this.runs.push(this.cur); this.x += n; this.cur = [[this.x, this.y]]; return this; }
  o(kind, x, props = {}) { const ob = Object.assign({ kind, x, base: this.y }, props); this.objs.push(ob); return ob; }
  row(x, n, dy = 18, gap = 22) { for (let i = 0; i < n; i++) this.o('check', x + i * gap, { dy }); }
  arc(x, n, w, h, dy = 18) { for (let i = 0; i < n; i++) { const t = n > 1 ? i / (n - 1) : 0.5; this.o('check', x + w * t, { dy: dy + h * Math.sin(Math.PI * t) }); } }
  arcAbs(x, y, n, w, h) { for (let i = 0; i < n; i++) { const t = n > 1 ? i / (n - 1) : 0.5; this.o('check', x + w * t, { y: y - h * Math.sin(Math.PI * t) }); } }
  boxes(x, cols) { cols.forEach((n, i) => { for (let r = 0; r < n; r++) this.o('box', x + i * 32, { dy: 24 * (r + 1) }); }); }
  enemy(type, x) { this.o('enemy', x, { type }); }
  finish(pad) {
    this.flat(pad); this.runs.push(this.cur);
    const ground = new Ground(this.runs);
    for (const ob of this.objs) if (ob.y === undefined) ob.y = (ground.at(ob.x) ?? ob.base) - (ob.dy || 0);
    return { ground, objs: this.objs, end: this.x };
  }
}


// ============================================================
//  LEVEL GENERATOR: 10 levels, difficulty grows with index
// ============================================================
function genLevel(li) {
  const L = LEVELS[li], T = ZONES[L.th], d = li / 9;
  const r = rnd(4242 + li * 977);
  const b = new Builder(400);
  b.cand = [];
  const pk = arr => arr[Math.floor(r() * arr.length)];
  const enemy = () => pk(T.enemies);
  const decor = x => b.o('decor', x, { k: pk(T.decor) });
  const nCh = n => Math.max(2, Math.round(n * (1 - d * 0.35)));
  const boards = BOARDS[L.th];
  let bi = Math.floor(r() * boards.length);
  const board = x => b.o('board', x, { t: boards[(bi++) % boards.length] });
  const item = () => pk(['checks', 'checks', 'shield', 'shoes', 'magnet', 'checks', 'life']);

  const C = {
    run() {
      const s = b.x, n = 320 + R(r() * 160); b.flat(n);
      b.row(s + 60, nCh(5));
      if (r() < 0.45 + d * 0.5) b.enemy(enemy(), s + n * 0.65);
      decor(s + 30);
      if (r() < 0.3) board(s + n - 60);
      if (r() < 0.25) b.o('monitor', s + n * 0.4, { item: item() });
    },
    hill() { const s = b.x, n = 360 + R(r() * 120), h = 40 + R(r() * 40); b.hill(n, h); b.arc(s + n * 0.2, nCh(6), n * 0.6, h * 0.8, 22); },
    down() { const s = b.x, n = 300 + R(r() * 100), dy = 70 + R(r() * 50); b.curve(n, dy); b.row(s + 50, nCh(6), 24, (n - 80) / 6); },
    up() { const s = b.x, n = 300 + R(r() * 100), dy = 60 + R(r() * 40); b.curve(n, -dy); b.row(s + 50, nCh(5), 24, (n - 80) / 5); },
    loop() {
      let s = b.x; b.curve(300, 90); b.row(s + 60, nCh(5), 24, 40);
      s = b.x; b.flat(560);
      const rr = 58, cx = s + 240;
      b.o('loop', cx, { r: rr });
      for (let i = 0; i < 8; i++) { if (i === 4) continue; const a = i / 8 * Math.PI * 2; b.o('check', cx + Math.sin(a) * 40, { y: b.y - rr + Math.cos(a) * 40 }); }
      b.cand.push({ x: cx, y: b.y - 2 * rr + 20 });
      decor(s + 480);
    },
    pit() {
      const s = b.x; b.flat(180);
      const swim = T.pit !== 'hole';
      let wdt = 90 + R(d * 110 + r() * 30);
      const plat = wdt > (swim ? 130 : 175);
      if (plat) wdt += 60;
      b.pit(wdt);
      if (plat) b.o('plat', s + 180 + wdt / 2, { y: b.y - 6, w: 56, mx: wdt / 2 - 40, sp: 0.018 + d * 0.012, ph: r() * 6 });
      b.arcAbs(s + 160, b.y - 40, 5, wdt + 40, 40);
      b.flat(80);
    },
    rampPit() {
      const s = b.x; b.flat(220);
      const h = 40 + R(r() * 20); b.ramp(150, h);
      const wdt = 110 + R(d * 70); b.pit(wdt);
      b.arcAbs(s + 380, b.y - 50, 5, wdt, 40);
      b.cand.push({ x: s + 370 + wdt / 2, y: b.y - h - 85 });
      b.flat(120);
    },
    boxes() {
      const s = b.x; b.flat(420);
      const pats = d < 0.3 ? [[1, 2], [1, 1, 2]] : d < 0.6 ? [[1, 2, 3], [2, 2], [1, 2, 2]] : [[1, 2, 3, 3], [2, 3], [1, 3, 3]];
      const pat = pk(pats);
      b.boxes(s + 100, pat);
      const mx = Math.max(...pat);

function groundFollow(h) {
  const G = world.ground;
  if (h.on) {
    const p = h.on;
    if (!p.dead && h.x + PH.hw > p.x && h.x - PH.hw < p.x + p.w) { h.y = p.y; return true; }
    const g = G.at(h.x);
    if (g !== null && Math.abs(g - h.y) <= PH.snap + 1) { h.on = null; h.y = g; return true; }
    h.on = null; h.onGround = false; h.vy = 0;
    return false;
  }
  const g = G.at(h.x);
  if (g === null) { h.onGround = false; h.vy = 0; return false; }
  if (g > h.y + PH.snap) {
    // ledge or ramp lip: launch along previous slope
    const s = G.slope(h.x - Math.sign(h.vx || 1) * 2);
    h.onGround = false; h.vy = Math.min(0, s * h.vx);
    return false;
  }
  h.y = g;
  return true;
}

function land(h, y, on) {
  h.y = y; h.vy = 0; h.onGround = true; h.on = on || null;
  h.springPose = false;
  if (h.hurt) { h.hurt = false; h.vx = 0; }
  h.ball = false;
  if (keys.down && Math.abs(h.vx) > 1) h.rolling = true;
  h.combo = 0;
}

function say(owner, text, t = 120) {
  world.bubbles = world.bubbles.filter(b => b.owner !== owner);
  world.bubbles.push({ owner, text, t, max: t });
}

function hurtHero(h, fromX) {
  if (h.inv > 0 || h.dead) return;
  if (h.shield) {
    h.shield = false; h.inv = 90;
  } else if (game.checks > 0) {
    scatterChecks(h, Math.min(game.checks, 32));
    game.checks = 0; h.inv = 120;
  } else { killHero(h, 'hit'); return; }
  h.hurt = true; h.onGround = false; h.on = null; h.ball = false; h.rolling = false; h.crouch = false;
  h.vy = -4; h.vx = (h.x < fromX ? -2 : 2);
  say(h, pick(['ОЙ-ОЙ!', 'АЙ, МОИ ЧЕКИ!', 'ЭЙ, АККУРАТНЕЕ!']), 60);
}

function killHero(h, why) {
  if (h.dead) return;
  h.dead = true; h.deadT = 0; h.vy = -6.5; h.vx = 0; h.ball = false; h.rolling = false; h.loop = null;
  h.why = why;
}

function scatterChecks(h, n) {
  let a = 101.25 * Math.PI / 180, sp = 4;
  for (let i = 0; i < n; i++) {
    const vx = Math.cos(a) * sp * (i % 2 ? -1 : 1), vy = -Math.sin(a) * sp;
    world.loose.push({ x: h.x, y: h.y - 16, vx, vy, t: 256 });
    if (i % 2) a += 22.5 * Math.PI / 180;
    if (i === 15) { sp = 2; a = 101.25 * Math.PI / 180; }
  }
}

function breakMonitor(s, h) {
  s.dead = true;
  addScore(10, s.x + 12, s.y);
  world.fx.push(fxPuff(s.x + 12, s.y + 12));
  world.fx.push({ k: 'icon', item: s.item, x: s.x + 12, y: s.y + 8, t: 60 });
  for (let i = 0; i < 6; i++) world.fx.push(fxShard(s.x + 12, s.y + 12, '#8a5a2b'));
  if (s.item === 'checks') { addChecks(10); }
  else if (s.item === 'shield') { h.shield = true; say(h, 'ЩИТ-ЛЕПЁШКА!', 70); }
  else if (s.item === 'shoes') { h.shoes = 600; say(h, 'КРОССОВКИ «АБИБАС»!', 80); }
  else if (s.item === 'life') { game.lives++; say(h, '+1 ЭРМЕК!', 70); }
  else if (s.item === 'magnet') { h.magnet = true; say(h, 'МАГНИТ ДЛЯ ЧЕКОВ!', 70); }
  if (!h.onGround && h.vy > 0) h.vy = -4;
}

function breakBox(s) {
  s.dead = true;
  addScore(10, s.x + 16, s.y);
  for (let i = 0; i < 10; i++) world.fx.push(fxPaper(s.x + 16, s.y + 12));
  for (let i = 0; i < 4; i++) world.fx.push(fxShard(s.x + 16, s.y + 12, '#c8975a'));
}

function addChecks(n) {
  const before = game.checks;
  game.checks += n;
  if (Math.floor(game.checks / 100) > Math.floor(before / 100)) { game.lives++; say(game.hero, '+1 ЭРМЕК!', 80); }
}
function addScore(n, x, y) { game.score += n; if (x !== undefined) world.fx.push({ k: 'score', x, y, t: 50, n }); }

// ============================================================
//  EFFECTS
// ============================================================
function fxDust(x, y) { return { k: 'dust', x: x + (RNG() - 0.5) * 4, y: y - 2, vx: (RNG() - 0.5) * 0.6, vy: -0.3 - RNG() * 0.4, t: 20 }; }
function fxPuff(x, y) { return { k: 'puff', x, y, t: 24 }; }
function fxSpark(x, y) { return { k: 'spark', x, y, t: 18 }; }
function fxShard(x, y, c) { return { k: 'shard', x, y, vx: (RNG() - 0.5) * 5, vy: -2 - RNG() * 3, t: 50, c }; }
function fxPaper(x, y) { return { k: 'paper', x, y, vx: (RNG() - 0.5) * 4, vy: -2 - RNG() * 3, t: 90, ph: RNG() * 6 }; }
function fxSplash(x, y) { return { k: 'splash', x, y, t: 30 }; }

function updateFx() {
  for (const f of world.fx) {
    f.t--;
    if (f.k === 'dust') { f.x += f.vx; f.y += f.vy; }
    else if (f.k === 'shard') { f.x += f.vx; f.y += f.vy; f.vy += 0.25; }
    else if (f.k === 'paper') { f.ph += 0.15; f.x += f.vx + Math.sin(f.ph) * 0.6; f.y += f.vy; f.vy = Math.min(0.8, f.vy + 0.12); f.vx *= 0.97; }
    else if (f.k === 'score' || f.k === 'icon') f.y -= 0.5;
  }
  world.fx = world.fx.filter(f => f.t > 0);
  for (const b of world.bubbles) b.t--;
  world.bubbles = world.bubbles.filter(b => b.t > 0 && !(b.owner && b.owner.gone));
}

// ============================================================
//  OBJECT UPDATE & INTERACTIONS
// ============================================================
function updateWorld() {
  const w = world, h = game.hero, G = w.ground;
  w.t++;
  const hb = heroBox(h);
  const attacking = h.ball || h.rolling || (h.crouch && h.spin > 0.5) || !!h.loop || !!h.ride;
  const near = (x, m = 80) => x > w.camX - m && x < w.camX + W + m;

  // wind gusts (Ala-Archa)
  if (w.lv.wind) {
    const gust = Math.pow(Math.max(0, Math.sin(w.t * 0.006)), 3);
    w.windDir = Math.sin(w.t * 0.0021 + 1) > 0 ? -1 : 1;
    w.windF = w.windDir * gust * (0.035 + 0.015 * w.diff);
    w.gust = gust;
  }

  // platforms
  for (const p of w.plats) {
    const ox = p.x, oy = p.y;
    p.x = p.x0 + Math.sin(w.t * p.sp + p.ph) * p.mx;
    p.y = p.y0 + Math.sin(w.t * p.sp * 1.3 + p.ph) * p.my + (w.zone.plat === 'swan' ? Math.sin(w.t * 0.05 + p.x0) * 1.5 : 0);
    p.dx = p.x - ox; p.dy = p.y - oy;
    if (h.on === p && h.onGround) { h.x += p.dx; h.y = p.y; }
  }
  for (const s of w.solids) if (s.plat && !s.dead) { s.x = s.plat.x + (s.relX ??= s.x - s.plat.x); s.y = s.plat.y - 24; }

  // checks
  if (!h.dead) for (const c of w.checks) {
    if (c.got || !near(c.x, 20)) continue;
    if (h.magnet) {
      const dx = h.x - c.x, dy = h.y - 17 - c.y;
      if (dx * dx + dy * dy < 100 * 100) { c.x += dx * 0.14; c.y += dy * 0.14; }
    }
    if (c.x + 8 > hb.x && c.x - 8 < hb.x + hb.w && c.y + 6 > hb.y && c.y - 6 < hb.y + hb.h) {
      c.got = true; addChecks(1); w.fx.push(fxSpark(c.x, c.y));
    }
  }
  for (const c of w.loose) {
    c.t--; c.vy += 0.09; c.x += c.vx; c.y += c.vy;
    const g = G.at(c.x);
    if (g !== null && c.y > g - 6 && c.vy > 0) { c.y = g - 6; c.vy *= -0.75; }
    if (c.t < 230 && !h.dead && c.x + 8 > hb.x && c.x - 8 < hb.x + hb.w && c.y + 6 > hb.y && c.y - 6 < hb.y + hb.h) {
      c.t = 0; addChecks(1); w.fx.push(fxSpark(c.x, c.y));
    }
  }
  w.loose = w.loose.filter(c => c.t > 0);

  // golden kalpaks
  for (const k of w.kalpaks) {
    if (k.got || h.dead) continue;
    if (k.x > hb.x - 8 && k.x < hb.x + hb.w + 8 && k.y > hb.y - 10 && k.y < hb.y + hb.h + 6) {
      k.got = true; game.kalGot.add(k.id); addScore(1000, k.x, k.y - 16);
      say(h, pick(['ЗОЛОТОЙ КАЛПАК!', 'КАЛПАК ДЕДУШКИ!', 'ВОТ ЭТО НАХОДКА!']), 80);
      for (let i = 0; i < 12; i++) w.fx.push({ k: 'spark', x: k.x + (RNG() - 0.5) * 30, y: k.y - 8 + (RNG() - 0.5) * 24, t: 10 + i * 2 });
    }
  }
  // marshrutka stops
  for (const st of w.stops) {
    if (st.used || h.dead || h.ride || h.loop || !h.onGround || Math.abs(h.x - st.x) > 10) continue;
    st.used = true;
    let endX = st.x + 1700;
    for (let x = st.x + 40; x < st.x + 1700; x += 8) {
      const blocked = G.at(x) === null || w.loops.some(L => Math.abs(L.x - x) < 90) || w.springs.some(p => Math.abs(p.x - x) < 30)
        || w.cones.some(c => Math.abs(c.x - x) < 30) || w.solids.some(o => x > o.x - 30 && x < o.x + o.w + 30 && o.y > (G.at(x) ?? 0) - 60);
      if (blocked) { endX = x - 110; break; }
    }
    if (endX > st.x + 200) {
      h.ride = { v: 2, t: 0, endX }; h.y -= 34; h.inv = 0;
      w.fx.push(fxPuff(h.x, h.y + 20));
      say(h, pick(['САДИСЬ, ДОВЕЗУ!', 'МАРШРУТКА 110 - ДО БАЗАРА!', 'ДЕРЖИСЬ ЗА КРЫШУ!']), 100);
    }
  }
  if (w.bus) { w.bus.t++; w.bus.x += 8; const g = G.at(w.bus.x); if (g !== null) w.bus.y = g; if (w.bus.t > 140) w.bus = null; }

  // springs
  for (const s of w.springs) {
    if (s.anim > 0) s.anim--;
    if (!h.dead && !h.loop && h.vy >= 0 && hb.x < s.x + s.w && hb.x + hb.w > s.x && h.y >= s.y && h.y - 10 <= s.y + 4) {
      h.vy = s.p === 'R' ? -12.5 : -9.6; h.onGround = false; h.on = null; h.ball = false; h.rolling = false; h.crouch = false;
      h.springPose = true; h.y = s.y; s.anim = 12;
    }
  }

  // cones
  for (const c of w.cones) {
    if (c.hit) { c.vy += 0.3; c.x += c.vx; c.y += c.vy; c.rot += c.vx * 0.1; continue; }
    if (!h.dead && hb.x < c.x + 5 && hb.x + hb.w > c.x - 5 && hb.y < c.y && hb.y + hb.h > c.y - 14) {
      c.hit = true; c.vx = (h.vx >= 0 ? 1 : -1) * (2 + Math.abs(h.vx) * 0.5); c.vy = -4;
      addScore(10, c.x, c.y - 14);
      if (!attacking) { h.vx *= 0.3; if (h.onGround) { h.vy = -2.5; h.onGround = false; h.on = null; } say(h, pick(['ОЙ, КОНУС!', 'ОПЯТЬ РЕМОНТ!', 'КТО ТУТ КОПАЕТ?!']), 60); }
    }
  }
  w.cones = w.cones.filter(c => c.y < G.maxY + 400);

  // checkpoints
  for (const c of w.cps) {
    if (!c.on && h.x > c.x - 4 && !h.dead) {
      c.on = true; game.checkpoint = { x: c.x, y: c.y, time: game.time };
      for (let i = 0; i < 8; i++) w.fx.push({ k: 'spark', x: c.x + (RNG() - 0.5) * 30, y: c.y - 44 + (RNG() - 0.5) * 16, t: 18 + i * 3 });
      say(c, pick(['КУРС ОТЛИЧНЫЙ!', 'ОБМЕН БЕЗ КОМИССИИ!', 'ТОЧКА СОХРАНЕНА!']), 90);
    }
  }

  // enemies
  for (const e of w.enemies) {
    if (e.gone) continue;
    e.t++;
    if (!near(e.x, 260)) continue;
    updateEnemy(e, h);
    if (e.state === 'happy' || h.dead) continue;
    const eb = { x: e.x - e.w / 2, y: e.y - e.h, w: e.w, h: e.h };
    if (overlap(hb, eb) && e.inv <= 0 && h.ride) { hitEnemy(e, h); continue; }
    if (overlap(hb, eb) && e.inv <= 0) {
      const stomp = !h.onGround && h.vy > 0 && h.y - h.vy <= eb.y + 10;
      if (attacking || stomp) {
        if (!h.onGround) { h.vy = keys.up ? -Math.max(5.5, Math.abs(h.vy)) : -4.5; }
        else h.vx = -h.vx * 0.4;
        hitEnemy(e, h);
      } else hurtHero(h, e.x);
    }
  }
  w.enemies = w.enemies.filter(e => !e.gone);
  for (const p of w.parrots) updateParrot(p, h, hb, attacking);
  w.parrots = w.parrots.filter(p => !p.gone);

  // goal
  if (w.goal) {
    const gl = w.goal;
    if (gl.passed) { gl.spin += Math.max(0.02, 0.5 - gl.t2 * 0.004); gl.t2++; }
    else if (h.x > gl.x && !h.dead) { gl.passed = true; gl.t2 = 0; game.finishZone(); }
  }
  // boss
  if (w.bossX !== null && !w.bossStarted && h.x > w.bossX - 20 && !h.dead) { w.bossStarted = true; startBoss(); }
  if (w.boss) updateBoss(w.boss, h, hb, attacking);
  for (const z of w.hazards) updateHazard(z, h, hb);
  w.hazards = w.hazards.filter(z => !z.gone);
  if (w.goldCheck) {
    const gc = w.goldCheck;
    gc.t++;
    gc.y = gc.y0 + Math.sin(gc.t * 0.05) * 6;
    if (!gc.got && !h.dead && Math.abs(h.x - gc.x) < 30 && Math.abs(h.y - 20 - gc.y) < 34) {
      gc.got = true; addScore(5000, gc.x, gc.y - 20);
      for (let i = 0; i < 16; i++) w.fx.push({ k: 'spark', x: gc.x + (RNG() - 0.5) * 50, y: gc.y + (RNG() - 0.5) * 30, t: 15 + i * 2 });
      game.finishZone();
    }
  }

  updateFx();

  // fall / time
  const pitUnder = G.pits.find(p => h.x >= p.x0 - 12 && h.x <= p.x1 + 12);
  if (pitUnder && !h.dead && !h.pitSaid && h.y > pitUnder.y + 24 && h.vy > 0) {
    h.pitSaid = true;
    say(h, w.zone.pit === 'water' ? 'ВОДА +18°... БРРР!' : 'КТО ВЫКОПАЛ ЭТУ ЯМУ?!', 120);
    if (w.zone.pit === 'water') w.fx.push(fxSplash(h.x, pitUnder.y + 16));
  }
  if (!h.dead && h.y > (pitUnder ? pitUnder.y + 170 : G.maxY + 140)) {
    killHero(h, 'pit');
  }
}

function updateEnemy(e, h) {
  const G = world.ground;
  if (e.inv > 0) e.inv--;
  e.talkT--;
  const dist = h.x - e.x;
  if (e.state === 'happy') {
    e.x += e.dir * 1.2; e.ph += 0.2;
    const g = G.at(e.x); if (g !== null) e.y = g;
    e.fade = (e.fade || 0) + 1;
    if (e.fade > 160) e.gone = true;
    return;
  }
  if (e.type === 'porter') {
    e.ph += 0.25;
    walk(e, 1.4 * e.spd, 150);
    if (e.talkT <= 0 && Math.abs(dist) < 240) { say(e, pick(LINES.porter), 70); e.talkT = 160 + RNG() * 120; }
    return;
  }
  if (e.type === 'arkhar') {
    if (e.air) {
      e.vy += 0.3; e.x += e.vx; e.y += e.vy; e.ph += 0.1;
      const g = G.at(e.x);
      if (g !== null && e.y >= g && e.vy > 0) { e.y = g; e.air = false; e.t = 0; }
      if (e.y > G.maxY + 300) e.gone = true;
    } else {
      e.ph += 0.04;
      if (e.t > 90 - 40 * e.diff && Math.abs(dist) < 230 && Math.abs(h.y - e.y) < 140 && !h.dead) {
        const dir = Math.sign(dist) || 1, vx = dir * (1.4 + e.spd);
        const land = G.at(e.x + vx * 36), here = G.at(e.x);
        if (land !== null && Math.abs(land - here) < 60 && Math.abs(e.x + vx * 36 - e.x0) < 180) {
          e.air = true; e.dir = dir; e.vx = vx; e.vy = -5.5; e.t = 0;
          if (RNG() < 0.4) say(e, pick(LINES.arkhar), 50);
        } else e.t = 0;
      }
    }
    return;
  }
  if (e.type === 'lyuda') {
    e.ph += 0.12;
    walk(e, 0.45 * e.spd, 90);
    if (e.talkT <= 0 && Math.abs(dist) < 200) { say(e, pick(LINES.lyuda), 110); e.talkT = 260 + RNG() * 200; }
    if (e.parrot) {
      e.parrotT -= e.spd;
      if (e.parrotT <= 0 && Math.abs(dist) < 190 && Math.abs(h.y - e.y) < 120 && !h.dead) {
        e.parrot = false;
        const p = { owner: e, x: e.x - 4 * e.dir, y: e.y - 30, sx: 0, sy: 0, tx: h.x, ty: h.y - 16, t: 0, dur: 70, state: 'out', flap: 0, bh: 8 };
        p.sx = p.x; p.sy = p.y;
        world.parrots.push(p);
        say(p, pick(LINES.kesha), 70);
      }
    }
  } else {
    if (e.state === 'walk') {
      e.ph += 0.1;
      walk(e, 0.5 * e.spd, 100);
      if (Math.abs(dist) < 170 && Math.abs(h.y - e.y) < 50 && !h.dead && e.t > 60) {
        e.dir = Math.sign(dist) || 1; e.state = 'wind'; e.t = 0; say(e, pick(LINES.li), 90);
      }
    } else if (e.state === 'wind') {
      if (e.t > 36) { e.state = 'charge'; e.t = 0; }
    } else if (e.state === 'charge') {
      e.ph += 0.35;
      if (!walk(e, 2.4 * e.spd, 100000)) { e.state = 'tired'; e.t = 0; }
      if (e.t > 70) { e.state = 'tired'; e.t = 0; }
    } else if (e.state === 'tired' || e.state === 'dizzy') {
      e.ph += 0.08;
      if (e.t > (e.state === 'dizzy' ? 120 : 70)) { e.state = 'walk'; e.t = 0; }
    }
  }
}

function walk(e, sp, range) {
  const G = world.ground;
  const nx = e.x + e.dir * sp;
  const gn = G.at(nx + e.dir * e.w / 2), gc = G.at(nx);
  let blocked = gn === null || gc === null || Math.abs(gn - e.y) > 10 || Math.abs(nx - e.x0) > range;
  if (!blocked) for (const s of world.solids) if (!s.dead && nx + e.w / 2 > s.x && nx - e.w / 2 < s.x + s.w && e.y > s.y + 1 && e.y - e.h < s.y + s.h) { blocked = true; break; }
  if (blocked) { e.dir = -e.dir; return false; }
  e.x = nx; e.y = gc;
  return true;
}

function hitEnemy(e, h) {
  h.combo++;
  const pts = [100, 200, 500, 1000][Math.min(3, h.combo - 1)];
  e.hp--;
  world.fx.push(fxPuff(e.x, e.y - e.h / 2));
  if (e.hp > 0) {
    e.state = 'dizzy'; e.t = 0; e.inv = 40;
    addScore(pts, e.x, e.y - e.h);
    say(e, pick(LINES.liHit), 90);
    return;
  }
  addScore(pts, e.x, e.y - e.h);
  e.state = 'happy'; e.dir = Math.sign(e.x - h.x) || 1;
  say(e, pick({ lyuda: LINES.lyudaHappy, li: LINES.liHappy, porter: LINES.porterHappy, arkhar: LINES.arkharHappy }[e.type]), 120);
  e.air = false;
  for (let i = 0; i < 4; i++) world.fx.push({ k: 'heart', x: e.x + (RNG() - 0.5) * 16, y: e.y - e.h, t: 40 + i * 6, vx: 0 });
  for (const p of world.parrots) if (p.owner === e) { p.state = 'home'; p.t = 0; }
}

function updateParrot(p, h, hb, attacking) {
  p.t++; p.flap++;
  const e = p.owner;
  if (p.state === 'out') {
    const t = p.t / p.dur;
    const cx = (p.sx + p.tx) / 2, cy = Math.min(p.sy, p.ty) - 50;
    const u = Math.min(1, t);
    p.x = (1 - u) * (1 - u) * p.sx + 2 * (1 - u) * u * cx + u * u * p.tx;
    p.y = (1 - u) * (1 - u) * p.sy + 2 * (1 - u) * u * cy + u * u * p.ty;
    if (t >= 1) { p.state = 'back'; p.t = 0; p.bx = p.x; p.by = p.y; }
  } else {
    const tx = e.gone ? p.x + 200 : e.x - 4 * e.dir, ty = e.gone ? p.y - 200 : e.y - 30;
    const u = Math.min(1, p.t / (p.state === 'home' ? 40 : 60));
    p.x = lerp(p.bx ?? p.x, tx, u); p.y = lerp(p.by ?? p.y, ty, u);
    if (u >= 1) {
      p.gone = true;
      if (!e.gone && e.state !== 'happy') { e.parrot = true; e.parrotT = 180 + RNG() * 120; }
      else if (e.state === 'happy') e.parrot = true;
    }
  }
  if (p.state === 'out' && !h.dead && hb.x < p.x + 5 && hb.x + hb.w > p.x - 5 && hb.y < p.y + 4 && hb.y + hb.h > p.y - 4) {
    if (attacking) {
      p.state = 'home'; p.t = 0; p.bx = p.x; p.by = p.y; addScore(50, p.x, p.y - 10);
      say(p, 'КЕША ОБИДЕЛСЯ!', 70);
      if (!h.onGround) h.vy = -4;
    } else hurtHero(h, p.x);
  }
}

function startBoss() {
  const w = world, type = w.lv.boss, info = BOSS_INFO[type];
  const ax = w.bossX - 60;
  w.lock = { x0: ax, x1: ax + W };
  const b = { type, info, x: ax + W + 90, y: info.ground ? w.bossY : w.bossY - 150, hp: info.hp, max: info.hp, state: 'enter', t: 0,
    inv: 0, dir: -1, ph: 0, ax, gy: w.bossY, bh: info.bh, n: 0, forkY: -8, carry: true, vx: 0, vy: 0, d: w.diff, stamp: 0, dropT: 90 };
  w.boss = b;
  say(b, info.intro, 170);
  game.bossBar = true;

const bossSpan = (b, l, r) => b.dir > 0 ? [b.x + l, r - l] : [b.x - r, r - l];
function bossBoxes(b) {
  const gy = b.y;
  switch (b.type) {
    case 'asan': {
      const [vx, vw] = bossSpan(b, -28, -12), [dx, dw] = bossSpan(b, -30, 66);
      return { vuln: { x: vx, y: gy - 68, w: vw, h: 30 }, body: { x: dx, y: gy - 40, w: dw, h: 40 } };
    }
    case 'roller': {
      const [vx, vw] = bossSpan(b, -26, -2), [sx, sw] = bossSpan(b, 13, 43), [dx, dw] = bossSpan(b, -36, 14);
      return { vuln: { x: vx, y: gy - 68, w: vw, h: 30 }, spike: { x: sx, y: gy - 30, w: sw, h: 30 }, body: { x: dx, y: gy - 38, w: dw, h: 38 } };
    }
    case 'forklift': {
      const [vx, vw] = bossSpan(b, -18, 4), [fx, fw] = bossSpan(b, 20, 46), [dx, dw] = bossSpan(b, -34, 20);
      return { vuln: { x: vx, y: gy - 66, w: vw, h: 32 }, body: { x: dx, y: gy - 34, w: dw, h: 34 },
        body2: { x: fx, y: gy + b.forkY - (b.carry ? 28 : 6), w: fw, h: b.carry ? 30 : 8 } };
    }
    case 'leopard': {
      const box = { x: b.x - 22, y: gy - 26, w: 44, h: 26 };
      return { vuln: box, body: b.state === 'nap' ? null : box };
    }
    default: {
      const box = { x: b.x - 15, y: gy - 62, w: 30, h: 58 };
      return { vuln: box, body: box };
    }
  }
}

function updateBoss(b, h, hb, attacking) {
  b.t++; b.ph += 0.1;
  if (b.inv > 0) b.inv--;
  if (b.stamp > 0) b.stamp--;
  if (b.state === 'defeated' || b.state === 'leave') { bossOutro(b); return; }
  BOSS_AI[b.type](b, h);
  if (h.dead) return;
  const B = bossBoxes(b);
  if (b.inv <= 0 && B.vuln && overlap(hb, B.vuln) && (attacking || (!h.onGround && h.vy > 0))) {
    b.hp--; b.inv = 70;
    addScore(b.hp > 0 ? 500 : 5000, b.x, b.y - 70);
    h.vy = -5; h.vx = h.x < b.x ? -3 : 3; h.onGround = false; h.on = null; h.ball = true; h.rolling = false;
    for (let i = 0; i < 6; i++) world.fx.push(b.type === 'asan' ? fxShard(b.x, b.y - 40, '#3a9a3a') : fxPaper(b.x, b.y - 40));
    if (b.hp <= 0) {
      b.state = 'defeated'; b.t = 0; game.bossBar = false;
      world.hazards.forEach(z => z.gone = true);
      say(b, 'ОЙ-ОЙ-ОЙ!', 80);
    } else say(b, b.info.hits[b.max - b.hp - 1] || 'АЙ!', 90);
    return;
  }
  if (B.spike && overlap(hb, B.spike)) { hurtHero(h, b.x); return; }
  for (const box of [B.body, B.body2]) {
    if (!box || !overlap(hb, box)) continue;
    if (attacking) { h.vx = (h.x < b.x ? -4 : 4); h.vy = -3.5; h.onGround = false; h.on = null; h.ball = true; h.rolling = false; }
    else hurtHero(h, b.x);
    return;
  }
}

function bossOutro(b) {
  const w = world;
  if (b.state === 'defeated') {
    if (!b.info.ground) { b.y = Math.min(b.gy - 30, b.y + Math.min(3, b.t * 0.05)); b.x += Math.sin(b.t * 0.3) * 0.6; }
    if (b.type === 'leopard') { b.y = b.gy; b.lstate = 'nap'; }
    if (b.t % 7 === 0 && b.t < 120) w.fx.push(fxPuff(b.x + (RNG() - 0.5) * 30, b.y - 30 + (RNG() - 0.5) * 24));
    if (b.t === 90) say(b, b.info.defeat, 170);
    if (b.t > 230) { b.state = 'leave'; b.t = 0; }
  } else {
    if (b.type === 'auditor') { b.x += 2.5; b.y -= 2; }
    else if (b.type === 'leopard') { if (b.t > 40) { b.lstate = 'run'; b.x += 3; b.dir = 1; } }
    else { b.dir = 1; b.x += 2.5; }
    if (b.t === 50) w.goldCheck = { x: b.ax + W / 2, y0: b.gy - 70, y: b.gy - 70, t: 0, got: false };
    if (b.t > 200) { w.boss = null; }
  }
}

function addHaz(z) { world.hazards.push(Object.assign({ vx: 0, vy: 0, t: 0, landed: false }, z)); }

const BOSS_AI = {

    }
    if (b.throwT > 0) b.throwT--;
  },
  roller(b, h) {

    if (b.state === 'enter') {
      b.dir = -1; b.x -= 1.5; b.ph += 0.1;
      if (b.x <= Rr) { b.state = 'drive'; b.t = 0; }
    } else if (b.state === 'drive') {
      b.x += b.dir * sp; b.ph += sp * 0.08;

      if (b.t % 95 === 50) addHaz({ kind: 'cone', x: b.x - b.dir * 10, y: b.gy - 66, vx: clamp((h.x - b.x) / 70, -3, 3), vy: -5 });
      if ((b.dir < 0 && b.x <= L) || (b.dir > 0 && b.x >= Rr)) { b.state = 'stop'; b.t = 0; say(b, 'БИП-БИП! ЗАДНИЙ ХОД!', 60); }
    } else if (b.state === 'stop') {
      b.x += Math.sin(b.t) * 0.5;
      if (b.t > 55 - 20 * b.d) { b.dir = -b.dir; b.state = 'drive'; b.t = 1; }
    }
  },
  forklift(b, h) {
    const L = b.ax + 80, Rr = b.ax + W - 80;
    if (b.state === 'enter') {
      b.dir = -1; b.x -= 1.8; b.ph += 0.1;
      if (b.x <= Rr) { b.state = 'aim'; b.t = 0; }
    } else if (b.state === 'aim') {
      b.dir = h.x > b.x ? 1 : -1;
      b.carry = true;
      b.forkY = lerp(-8, -44, Math.min(1, b.t / 40));
      if (b.t > 50 - 15 * b.d) {
        const sx = b.x + b.dir * 36, sy = b.y + b.forkY - 2;
        addHaz({ kind: 'box', x: sx, y: sy, vx: clamp((h.x - sx) / 50, -4.5, 4.5), vy: -5.5 });
        b.carry = false; b.state = 'wait'; b.t = 0; b.n++;
      }
    } else if (b.state === 'wait') {
      b.forkY = lerp(-44, -8, Math.min(1, b.t / 30));
      if (b.t > 40) {
        if (b.n % 3 === 0) { b.state = 'charge'; b.t = 0; b.dir = b.x > b.ax + W / 2 ? -1 : 1; say(b, pick(['ОПТОВАЯ ДОСТАВКА!', 'РАЗГРУЗКА!', 'ДОРОГУ ПОГРУЗЧИКУ!']), 60); }
        else { b.state = 'aim'; b.t = 0; }
      }
    } else if (b.state === 'charge') {
      b.x += b.dir * (2.6 + 1.4 * b.d); b.ph += 0.2;
      if ((b.dir < 0 && b.x <= L) || (b.dir > 0 && b.x >= Rr)) { b.state = 'aim'; b.t = 0; }
    }
  },
  leopard(b, h) {
    const L = b.ax + 50, Rr = b.ax + W - 50;
    if (b.state === 'enter') {
      b.dir = -1; b.x -= 3; b.lstate = 'run'; b.ph += 0.3;

    } else if (b.state === 'crouch') {
      b.lstate = 'crouch'; b.dir = h.x > b.x ? 1 : -1;
      if (b.t > 34 - 14 * b.d) {
        const tx = clamp(h.x, L, Rr);
        b.vy = -7 - 1.5 * b.d; b.vx = (tx - b.x) / (2 * -b.vy / 0.3);
        b.state = 'leap'; b.t = 0; b.lstate = 'leap';
      }
    } else if (b.state === 'leap') {
      b.vy += 0.3; b.x += b.vx; b.y += b.vy;
      b.x = clamp(b.x, L, Rr);
      if (b.y >= b.gy && b.vy > 0) {
        b.y = b.gy; b.state = 'land'; b.t = 0; b.lstate = 'land'; b.n++;
        world.fx.push(fxPuff(b.x, b.y - 4));
        for (const dir of [-1, 1]) addHaz({ kind: 'wave', x: b.x + dir * 20, y: b.gy, vx: dir * (2.4 + 1.2 * b.d) });
      }
    } else if (b.state === 'land') {
      if (b.t > 22) {
        if (b.n % 3 === 0) { b.state = 'nap'; b.t = 0; b.lstate = 'nap'; say(b, 'ЗЕВ... МУР...', 70); }
        else { b.state = 'crouch'; b.t = 0; }
      }
    } else if (b.state === 'nap') {
      if (b.t > 110 - 30 * b.d) { b.state = 'crouch'; b.t = 0; }
    }
  },
  auditor(b, h) {
    const hoverY = b.gy - 92;
    const L = b.ax + 70, Rr = b.ax + W - 70;
    const angry = b.hp <= b.max / 2;
    if (angry && !b.angry) { b.angry = true; say(b, 'ВКЛЮЧАЮ УСИЛЕННЫЙ КОНТРОЛЬ!', 100); }
    if (b.state === 'enter') {
      b.x = lerp(b.x, b.ax + W - 110, 0.03); b.y = lerp(b.y, hoverY, 0.04);
      if (b.t > 120) { b.state = 'fly'; b.t = 0; }
    } else if (b.state === 'fly') {
      b.x += b.dir * (1.1 + (b.max - b.hp) * 0.12 + (angry ? 0.6 : 0));
      if (b.x < L) b.dir = 1; if (b.x > Rr) b.dir = -1;
      b.y = hoverY + Math.sin(b.t * 0.05) * 6;
      b.dropT--;

        b.stamp = 14;
        if (angry && RNG() < 0.6) for (const vx of [-1.6, 0, 1.6]) addHaz({ kind: 'stamp', x: b.x + 10, y: b.y - 20, vx });
        else addHaz({ kind: RNG() < 0.5 ? 'box' : 'stamp', x: b.x + 10, y: b.y - 20 });
        b.dropT = Math.max(50, 110 - (b.max - b.hp) * 9);
      }
      if (b.t > (angry ? 200 : 300)) { b.state = 'swoop'; b.t = 0; b.tx = clamp(h.x, L, Rr); b.sx = b.x; }
    } else if (b.state === 'swoop') {
      const u = b.t / 90;
      b.x = lerp(b.sx, b.tx, Math.min(1, u * 1.4));
      b.y = hoverY + Math.sin(Math.PI * Math.min(1, u)) * 44;
      if (u >= 1) { b.state = 'fly'; b.t = 0; }
    }
  },
};

function updateHazard(z, h, hb) {
  z.t++;
  const G = world.ground, lk = world.lock;
  const g = G.at(z.x);
  if (lk && (z.x < lk.x0 - 20 || z.x > lk.x1 + 20)) { z.gone = true; return; }
  let zb;
  if (z.kind === 'melon') {
    if (!z.landed) {
      z.vy += 0.25; z.x += z.vx; z.y += z.vy;
      if (g !== null && z.y >= g - 5) { z.y = g - 5; z.landed = true; z.vx = Math.sign(z.vx || 1) * z.roll; }
    } else { z.x += z.vx; z.rot = (z.rot || 0) + z.vx * 0.15; if (g !== null) z.y = g - 5; }
    if (z.t > 420) z.gone = true;
    zb = { x: z.x - 6, y: z.y - 6, w: 12, h: 12 };
    if (!h.dead && overlap(hb, zb)) {
      if (h.ball || h.rolling) { z.gone = true; addScore(50, z.x, z.y - 10); for (let i = 0; i < 6; i++) world.fx.push(fxShard(z.x, z.y, i % 2 ? '#e8352a' : '#2f8a2f')); if (!h.onGround) h.vy = -3.5; }
      else hurtHero(h, z.x);
    }
    return;
  }
  if (z.kind === 'tar') {
    if (z.t > z.life) { z.gone = true; return; }
    zb = { x: z.x - 16, y: z.y - 4, w: 32, h: 4 };
    if (!h.dead && h.onGround && overlap(hb, zb)) hurtHero(h, z.x);
    return;
  }
  if (z.kind === 'wave') {
    z.x += z.vx;
    if (g !== null) z.y = g;
    zb = { x: z.x - 6, y: z.y - 12, w: 12, h: 12 };
    if (!h.dead && overlap(hb, zb)) hurtHero(h, z.x);
    if (z.t % 3 === 0) world.fx.push({ k: 'snow', x: z.x, y: z.y - 6, vx: -z.vx * 0.2, vy: -1, t: 18 });
    return;
  }
  // box / stamp / cone: fall, then land
  if (!z.landed) {
    z.vy = Math.min(8, z.vy + 0.25); z.y += z.vy; z.x += z.vx;
    if (g !== null && z.y >= g) {
      z.y = g; z.landed = true; z.t = 0;
      if (z.kind === 'box') { for (let i = 0; i < 5; i++) world.fx.push(fxPaper(z.x, z.y - 12)); }
      else world.fx.push(fxPuff(z.x, z.y - 4));
    }
  } else if (z.t > (z.kind === 'box' ? 150 : 30)) { z.gone = true; world.fx.push(fxPuff(z.x, z.y - 10)); }
  if (h.dead) return;
  zb = z.kind === 'box' ? { x: z.x - 16, y: z.y - 24, w: 32, h: 24 } : { x: z.x - 7, y: z.y - 12, w: 14, h: 12 };
  if (!z.landed && overlap(hb, zb)) hurtHero(h, z.x);
  if (z.landed && z.kind === 'box' && overlap(hb, zb)) {
    if (h.ball || h.rolling) { z.gone = true; for (let i = 0; i < 6; i++) world.fx.push(fxPaper(z.x, z.y - 12)); addScore(10, z.x, z.y - 20); }
    else if (h.vy >= 0 && h.y - h.vy <= zb.y + 4) { h.y = zb.y; h.vy = 0; h.onGround = true; }
    else { h.x = h.x < z.x ? zb.x - PH.hw : zb.x + zb.w + PH.hw; h.vx = 0; }
  }
}
